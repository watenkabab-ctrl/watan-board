<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 880">
  <defs>
    <pattern id="p" patternUnits="userSpaceOnUse" width="60" height="60" patternTransform="rotate(-45 0 0)">
      <rect width="60" height="20" fill="#CE1126"/>
      <rect y="20" width="60" height="20" fill="#4189DD"/>
      <rect y="40" width="60" height="20" fill="#007A3D"/>
    </pattern>
    <clipPath id="tl"><polygon points="0,0 145,0 0,145"/></clipPath>
    <clipPath id="tr"><polygon points="700,0 555,0 700,145"/></clipPath>
    <clipPath id="bl"><polygon points="0,880 145,880 0,735"/></clipPath>
    <clipPath id="br"><polygon points="700,880 555,880 700,735"/></clipPath>
  </defs>

  <rect width="700" height="880" fill="url(#p)" clip-path="url(#tl)"/>
  <rect width="700" height="880" fill="url(#p)" clip-path="url(#tr)"/>
  <rect width="700" height="880" fill="url(#p)" clip-path="url(#bl)"/>
  <rect width="700" height="880" fill="url(#p)" clip-path="url(#br)"/>

  <line x1="145" y1="0"   x2="0"   y2="145"  stroke="#C9973A" stroke-width="2" opacity="0.8"/>
  <line x1="555" y1="0"   x2="700" y2="145"  stroke="#C9973A" stroke-width="2" opacity="0.8"/>
  <line x1="0"   y1="735" x2="145" y2="880"  stroke="#C9973A" stroke-width="2" opacity="0.8"/>
  <line x1="700" y1="735" x2="555" y2="880"  stroke="#C9973A" stroke-width="2" opacity="0.8"/>
</svg>
