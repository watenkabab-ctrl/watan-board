<style>/* Fallback bis Fonts geladen — verhindert Layout-Shift */
.board-title,.item .nm,.item .pr,.sc-card-num,.sc-card-price{font-synthesis:none}</style>
<style>
:root{
  --g:#C8922A;--gl:#E8B84A;--gc:#FFE8A0;--cream:#EFE1C5;--mute:#7A6248;
  --ease:cubic-bezier(.22,1,.36,1);--ease-up:cubic-bezier(.4,0,1,1);--dwell:13s;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#1a0b03}
body{font-family:"Raleway",system-ui,sans-serif;color:var(--cream);cursor:none;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision}
.ember,.ember2{will-change:opacity}

/* ── BACKGROUND ── */
.ytbg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1;overflow:hidden;background:#000}
.ytbg video{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;object-fit:cover;
  -webkit-filter:brightness(1.45) contrast(1.0) saturate(1.3) hue-rotate(-6deg);
  filter:brightness(1.45) contrast(1.0) saturate(1.3) hue-rotate(-6deg);opacity:.72;
  -webkit-mask-image:linear-gradient(to top,#000 0%,#000 65%,rgba(0,0,0,.75) 82%,transparent 96%);
  mask-image:linear-gradient(to top,#000 0%,#000 65%,rgba(0,0,0,.75) 82%,transparent 96%)}
.ytbg iframe{position:absolute;top:50%;left:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);
  width:100vw;height:56.25vw;min-height:100vh;min-width:177.78vh;pointer-events:none;border:0}
.shade{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(20,6,1,.15) 0%,rgba(15,4,0,.08) 30%,transparent 55%)}
.texture{position:fixed;top:0;left:0;right:0;bottom:0;z-index:3;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml,%3Csvg width='300' height='300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='300' height='300' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E")}
/* fire glow layers */
.ember{position:fixed;top:auto;left:0;right:0;bottom:-2%;height:60vh;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse 90% 100% at 50% 110%,rgba(255,120,0,.75),rgba(220,90,0,.38) 42%,rgba(180,40,0,.12) 64%,transparent 75%);
  -webkit-animation:eb 4s ease-in-out infinite;animation:eb 4s ease-in-out infinite;will-change:opacity}
@-webkit-keyframes eb{0%,100%{opacity:.88}50%{opacity:1}}
@keyframes eb{0%,100%{opacity:.88}50%{opacity:1}}
.ember2{position:fixed;top:auto;left:0;right:0;bottom:-4%;height:45vh;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse 60% 80% at 50% 112%,rgba(255,165,0,.58),rgba(255,80,0,.26) 40%,transparent 62%);
  -webkit-animation:eb2 3s ease-in-out infinite;animation:eb2 3s ease-in-out infinite;will-change:opacity}
@-webkit-keyframes eb2{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes eb2{0%,100%{opacity:.75}50%{opacity:1}}
.vignette{position:fixed;top:0;left:0;right:0;bottom:0;z-index:8;pointer-events:none;
  box-shadow:inset 0 0 14vw 3vw rgba(0,0,0,.28)}

/* ── FRAME ── */
.frame{position:fixed;top:0;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;padding:1.2vh 2.5vw 1vh}

/* ── HEADER ── */
.head{text-align:center;flex-shrink:0;padding:.1vh 0 .05vh;
  -webkit-transition:opacity .5s ease;transition:opacity .5s ease}
.board-brand{font-size:.93vw;letter-spacing:.45em;text-transform:uppercase;
  color:rgba(225,175,55,.92);font-weight:600;margin-bottom:.05vh;
  font-family:"Raleway",system-ui,sans-serif}
.board-title{position:relative;display:inline-block;
  font-family:"Lora",serif;font-weight:700;
  font-size:4.75vw;line-height:1.0;letter-spacing:.04em;
  background:linear-gradient(135deg,#E8B84A 0%,#FFE8A0 40%,#C8922A 65%,#E8B84A 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  background-size:100% auto}
.board-title::before,.board-title::after{
  content:"";position:absolute;bottom:-.5vh;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);
  width:0;height:1px;background:linear-gradient(90deg,transparent,rgba(232,184,74,.6),rgba(255,232,160,.9),rgba(232,184,74,.6),transparent)}
.board-title::after{bottom:-.9vh;opacity:.4}
.board-title.anim::before{-webkit-animation:line-expand 1.2s cubic-bezier(.22,1,.36,1) .3s forwards;animation:line-expand 1.2s cubic-bezier(.22,1,.36,1) .3s forwards}
.board-title.anim::after{-webkit-animation:line-expand 1.2s cubic-bezier(.22,1,.36,1) .5s forwards;animation:line-expand 1.2s cubic-bezier(.22,1,.36,1) .5s forwards}
@-webkit-keyframes line-expand{to{width:110%}}
@keyframes line-expand{to{width:110%}}
.frame.showcase-mode .head{opacity:0;pointer-events:none}

/* ── STAGE ── */
.stage{flex:1;min-height:0;position:relative;margin:.1vh 0}
.slide{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;will-change:opacity}
.slide.on{opacity:1;pointer-events:auto;-webkit-transition:opacity .9s cubic-bezier(.22,1,.36,1);transition:opacity .9s cubic-bezier(.22,1,.36,1)}
.slide.leaving{opacity:0;pointer-events:none;-webkit-transition:opacity .85s cubic-bezier(.4,0,1,1);transition:opacity .85s cubic-bezier(.4,0,1,1)}

/* ── SLIDE HEADER ── */
.sl-head{flex-shrink:0;margin-bottom:.15vh}
.sl-head span{font-family:"Lora",serif;font-weight:700;font-size:1.5vw;
  color:var(--g);letter-spacing:.03em;display:block;
  text-shadow:0 0 2vw rgba(200,130,30,.3)}

/* ── GRID ── */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;grid-gap:.8vh 1vw;gap:.8vh 1vw}

/* ── ITEM ── */
.item{display:flex;flex-direction:column;min-width:0;min-height:0;padding:0;
  background:rgba(20,8,0,.18);
  border:1px solid rgba(255,200,100,.15);
  border-radius:1.2vw;overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
  position:relative}
.slide.on .item{-webkit-animation:enter var(--edur,1.1s) var(--een,cubic-bezier(.22,1,.36,1)) both;animation:enter var(--edur,1.1s) var(--een,cubic-bezier(.22,1,.36,1)) both;
  -webkit-animation-delay:calc(var(--i,0)*var(--estag,.09s));animation-delay:calc(var(--i,0)*var(--estag,.09s))}
@-webkit-keyframes enter{0%{opacity:0;-webkit-transform:translate(var(--fx,0px),var(--fy,0px))}100%{opacity:1;-webkit-transform:translate(0,0)}}
@keyframes enter{0%{opacity:0;transform:translate(var(--fx,0px),var(--fy,0px))}100%{opacity:1;transform:translate(0,0)}}
.slide.leaving .item{-webkit-animation:leave var(--ldur,.7s) ease-in both;animation:leave var(--ldur,.7s) ease-in both;
  -webkit-animation-delay:0s;animation-delay:0s;will-change:opacity}
@-webkit-keyframes leave{0%{opacity:1;-webkit-transform:scale(1)}100%{opacity:0;-webkit-transform:scale(.97)}}
@keyframes leave{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.97)}}

/* ── IMAGE ── */
.item .pic{flex:1 1 0;min-height:0;position:relative;overflow:hidden;
  background-size:100%;background-position:center center;background-repeat:no-repeat}
.item .pic img{display:none}
.item .pic .emo{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11vh;z-index:1}

/* ── TEXT PANEL ── */
.item .info{flex:0 0 auto;padding:1.2vh 1.1vw 1.4vh;
  background:linear-gradient(180deg,rgba(4,1,0,.0) 0%,rgba(4,1,0,.70) 28%,rgba(4,1,0,.80) 100%);
  border-top:1px solid rgba(200,146,42,.3);
  position:relative}
.item .info::before{content:"";position:absolute;top:0;left:1.1vw;right:1.1vw;height:1px;
  background:linear-gradient(90deg,transparent,rgba(232,184,74,.5),transparent)}
.item .nm{font-family:"Lora",serif;font-weight:700;font-size:1.85vw;line-height:1.2;
  color:#FFFAF0;letter-spacing:.02em;
  text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 6px rgba(0,0,0,1)}
.item .desc{font-family:"Raleway",sans-serif;font-size:1.0vw;color:#D4AF70;line-height:1.3;margin-top:.3vh;
  letter-spacing:.07em;text-transform:uppercase;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 3px rgba(0,0,0,.9)}
.item .bot{display:flex;align-items:center;justify-content:space-between;margin-top:.5vh;gap:.5vw}
.item .pr{font-family:"Lora",serif;font-weight:900;font-size:2.2vw;line-height:1.1;overflow:visible;
  background:linear-gradient(135deg,#C8922A 0%,#FFE8A0 50%,#C8922A 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-rendering:geometricPrecision}
.item .pr .cur{font-size:.6em;font-weight:600;vertical-align:.15em;margin-left:.05em;
  -webkit-text-fill-color:rgba(200,146,42,.9)}
.item .badge{font-size:.95vw;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:rgba(200,146,42,.8);white-space:nowrap}

/* ── SLIDE 2 CINEMATIC SHOWCASE ── */
.showcase{flex:1;min-height:0;position:relative;overflow:hidden}
/* plate — füllt gesamte Fläche, schräge Float-Animation */
.sc-img{position:absolute;top:0;left:0;right:0;bottom:0;z-index:10;
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.sc-img::before{content:"";display:none}
.sc-img img{width:77%;max-height:52vh;-webkit-object-fit:contain;object-fit:contain;position:relative;z-index:1;
  margin-bottom:24vh;will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.slide.on .sc-img img{-webkit-animation:sc-float 9s ease-in-out infinite;animation:sc-float 9s ease-in-out infinite}
@-webkit-keyframes sc-float{
  0%{-webkit-transform:translate3d(0,0,0) rotate(-7deg) scale(1)}
  30%{-webkit-transform:translate3d(-12px,0,0) rotate(-4deg) scale(1.022)}
  65%{-webkit-transform:translate3d(10px,0,0) rotate(-1deg) scale(0.984)}
  100%{-webkit-transform:translate3d(0,0,0) rotate(-7deg) scale(1)}}
@keyframes sc-float{
  0%{transform:translate3d(0,0,0) rotate(-7deg) scale(1)}
  30%{transform:translate3d(-12px,0,0) rotate(-4deg) scale(1.022)}
  65%{transform:translate3d(10px,0,0) rotate(-1deg) scale(0.984)}
  100%{transform:translate3d(0,0,0) rotate(-7deg) scale(1)}}
/* info-overlay am unteren Rand */
.sc-info{position:absolute;bottom:0;left:0;right:0;z-index:5;
  display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;
  padding:3vh 4vw 2.5vh;
  background:linear-gradient(to bottom,transparent,rgba(8,2,0,.92) 38%)}
.sc-row{position:relative;z-index:3;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:0;margin-top:1vh;width:72%;
  opacity:0;-webkit-animation:fade-up .85s ease .4s forwards;animation:fade-up .85s ease .4s forwards}
@-webkit-keyframes fade-up{from{opacity:0;-webkit-transform:translateY(10px)}to{opacity:1;-webkit-transform:translateY(0)}}
@keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@-webkit-keyframes row-rise{from{opacity:0;-webkit-transform:translateY(16px)}to{opacity:1;-webkit-transform:translateY(0)}}
@keyframes row-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.sc-card{display:flex;align-items:center;justify-content:space-between;
  padding:.38vh 0;border-bottom:1px solid rgba(200,146,42,.15)}
.sc-card:first-child{border-top:1px solid rgba(200,146,42,.15)}
.sc-card-left{display:flex;align-items:baseline;gap:1vw}
.sc-card-num{font-family:"Lora",serif;font-weight:900;font-size:4.2vw;color:#FFF8EC;text-rendering:geometricPrecision;
  text-shadow:0 2px 8px rgba(0,0,0,1),0 0 20px rgba(0,0,0,.8)}
.sc-card-tag{font-family:"Raleway",sans-serif;font-size:1.4vw;letter-spacing:.28em;text-transform:uppercase;color:#E8B84A;font-weight:700;text-rendering:geometricPrecision;
  text-shadow:0 1px 4px rgba(0,0,0,.9)}
.sc-card-price{font-family:"Lora",serif;font-weight:900;font-size:2.8vw;color:var(--gl);text-rendering:geometricPrecision;
  text-shadow:0 2px 8px rgba(0,0,0,1),0 0 20px rgba(0,0,0,.8)}
.sc-card-price .cur{font-size:.46em;vertical-align:.22em;margin-left:.05em;opacity:.85}
.sc-dot{display:none}

/* ── PROGRESS RAIL ── */
.rail{display:none}
.seg{width:6.5vw;height:.5vh;min-height:4px;background:rgba(200,146,42,.18);border-radius:4px;overflow:hidden;
  box-shadow:0 0 4px rgba(200,146,42,.08)}
.seg .fill{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;
  background:linear-gradient(90deg,var(--g),var(--gl),var(--gc))}
.seg.done .fill{transform:scaleX(1)}
@keyframes prog{to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .slide.on{opacity:1}.slide:not(.on){opacity:0}
  .slide.on .item{opacity:1;transform:none}
  .seg.on .fill,.seg.done .fill{transform:scaleX(1)}
}
</style>
</head>
<body>
<div class="ytbg" id="ytbg">
  <video id="firevid" autoplay muted loop playsinline webkit-playsinline x5-playsinline preload="auto" poster="images/grill_fire.jpg">
    <source src="video/fire4k.mp4" type="video/mp4">
    <source src="video/fire.mp4" type="video/mp4">
  </video>
</div>
<div class="shade"></div>
<div class="texture"></div>
<div class="ember"></div>
<div class="ember2"></div>
<div class="frame">
  <header class="head">
    <div class="board-brand">Watan Kabab</div>
    <div class="board-title" id="boardTitle">Grill Gerichte</div>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="rail" id="rail"></footer>
</div>
<div class="vignette"></div>
<script>
const SLIDES=[
  {title:"Grill Gerichte",star:"✦",ms:30000,items:[
    {n:"Chicken Wings Kebab",p:"12",d:"Marinierte Flügel · Knoblauch-Joghurt",img:"Chicken_Wings_Kebab_pr1.webp"},
    {n:"Chicken Tikka Kebab",p:"12,50",d:"Tandoor · Basmati-Reis · Beilagen",img:"Chicken_Tikka_Kebab_pr1.webp"},
    {n:"Zershk Palau · Hähnchen",p:"13,50",d:"Berberitzenreis · Safran · Hähnchen",img:"Zershk_Palau_Haehnchen.webp"},
    {n:"Chapli Kebab",p:"8",d:"Gehacktes Lamm · Kräuter · Fladenbrot",img:"Chapli_Kebab_pr1.webp"},
    {n:"Kobide Kebab",p:"15",d:"Rindshackfleisch · Gewürze · Basmati-Reis",img:"Kobide_Kebab_pr1.webp",noscale:true},
    {n:"Lamm Tikka Kebab",p:"18",d:"Zartes Lammfleisch · Tandoor · Beilagen",img:"Lamm_Tikka_Kebab.webp"},
    {n:"Lamm Kotelett",p:"19,50",d:"Gegrillte Lammkoteletts · Beilagen",img:"Lamm_Kotelett_pr1.webp"},
    {n:"Mix Grill · 1 Person",p:"20",d:"Wings · Chapli · Tikka · Koteletts",img:"Mix_Grill_1_Person_pr1.webp",hero:true},
  ]},
  {title:"Mix Grill",ms:7000,showcase:{
    n:"Mix Grill",
    sub:"Frisch vom Grill · Beilagen · Soßen · Salat",
    img:"Mix_Grill_Grillplatte_pr1.webp",
    opts:[
      {label:"Person",num:"1",p:"20"},
      {label:"Personen",num:"2",p:"40"},
      {label:"Personen",num:"4",p:"80"},
    ]
  }},
];
const stage=document.getElementById('stage'),rail=document.getElementById('rail');
SLIDES.forEach(sl=>{
  let inner="";
  if(sl.showcase){
    const sc=sl.showcase;
    const pills=sc.opts.map(o=>`
      <div class="sc-card">
        <div class="sc-card-left">
          <div class="sc-card-num">${o.num}</div>
          <div class="sc-card-tag">${o.label}</div>
        </div>
        <div class="sc-card-price">${o.p}<span class="cur">€</span></div>
      </div>`).join("");
    inner=`<div class="showcase">
      <div class="sc-img"><img src="images/${sc.img}" alt="" decoding="async" loading="eager"></div>
      <div class="sc-info">
        <div class="sc-title" style="text-align:center;-webkit-animation:row-rise .8s cubic-bezier(.22,1,.36,1) both;animation:row-rise .8s cubic-bezier(.22,1,.36,1) both;-webkit-animation-delay:.3s;animation-delay:.3s">
          <div style="font-family:'Lora',serif;font-weight:700;font-size:6.24vw;letter-spacing:.04em;background:linear-gradient(135deg,#E8B84A,#FFE8A0 45%,#C8922A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${sc.n}</div>
          <div style="font-family:'Raleway',sans-serif;font-size:1.02vw;letter-spacing:.38em;text-transform:uppercase;color:rgba(220,170,60,.9);margin-top:.3vh;font-weight:600;text-shadow:0 0 8px rgba(0,0,0,1),0 1px 4px rgba(0,0,0,1)">${sc.sub}</div>
        </div>
        <div class="sc-row">${pills}</div>
      </div>
    </div>`;
  } else {
    inner=`<div class="grid">${sl.items.map((d,idx)=>{
      const badge=d.badge?`<div class="badge">${d.badge}</div>`:"";
      const bgStyle=d.img?` style="background-image:url('images/${d.img}')"`:""
      const emo=!d.img?`<span class="emo">${d.emo||"🍢"}</span>`:"";
      const desc=d.d?`<div class="desc">${d.d}</div>`:"";
      return `<div class="item${d.noscale?" no-upscale":""}" style="--i:${idx}"${d.hero?" data-hero":""}><div class="pic${d.bigimg?" bigimg":""}"${bgStyle}>${emo}</div><div class="info"><div class="nm">${d.n}</div>${desc}<div class="bot"><div class="pr">${d.p}<span class="cur">€</span></div>${badge}</div></div></div>`;
    }).join("")}</div>`;
  }
  stage.insertAdjacentHTML('beforeend',`<section class="slide">${inner}</section>`);
  rail.insertAdjacentHTML('beforeend','<div class="seg"><span class="fill"></span></div>');
});
const slides=[...stage.children],segs=[...rail.children];let i=0,leaveT=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
const EAS=['cubic-bezier(.22,1,.36,1)','cubic-bezier(.16,1,.3,1)','cubic-bezier(.34,1.56,.64,1)','cubic-bezier(.5,0,.1,1)'];
function applyEntrance(sl){
  var een=EAS[0|rnd(0,EAS.length)];
  var edur=rnd(1.0,1.4).toFixed(2)+'s';
  var estag=rnd(.06,.11).toFixed(3)+'s';
  sl.style.setProperty('--een',een);
  sl.style.setProperty('--edur',edur);
  sl.style.setProperty('--estag',estag);
  var items=sl.querySelectorAll('.item');
  if(!items.length)return;
  var mode=0|(Math.random()*4);
  var dirs=[[-3,0],[3,0],[-3,0],[3,0],[-2.5,0],[2.5,0],[-3,0],[3,0]];// scatter directions
  items.forEach(function(el,k){
    var fx='0px',fy='0px';
    if(mode===0){// pure opacity
    } else if(mode===1){// wave from left
      fx=(-2.5-k*0.3).toFixed(1)+'vw';
    } else if(mode===2){// wave from right
      fx=(2.5+k*0.3).toFixed(1)+'vw';
    } else {// scatter: alternating left/right per item
      fx=dirs[k%dirs.length][0]+'vw';
    }
    el.style.setProperty('--fx',fx);
    el.style.setProperty('--fy',fy);
  });
}
function applyExit(sl){
  sl.style.setProperty('--ldur',rnd(.55,.75).toFixed(2)+'s');
}
function setVideos(sl,play){sl.querySelectorAll('video').forEach(v=>{try{play?v.play().catch(()=>{}):v.pause();}catch(e){}});}
const frame=document.querySelector('.frame'),boardTitle=document.getElementById('boardTitle');
function show(n){
  const next=(n+slides.length)%slides.length;
  const sl=SLIDES[next];
  slides.forEach((s,k)=>{
    if(k===next){s.classList.remove('leaving');applyEntrance(s);s.classList.add('on');setVideos(s,true);}
    else if(k===i&&k!==next){s.classList.remove('on');applyExit(s);s.classList.add('leaving');setVideos(s,false);}
    else{s.classList.remove('on','leaving');setVideos(s,false);}
  });
  // Update header title + hide header on showcase slide
  if(sl.showcase){
    var scNode=slides[next];
    var scTitle=scNode.querySelector('.sc-title');
    var scRow=scNode.querySelector('.sc-row');
    if(scTitle){scTitle.style.webkitAnimation='none';scTitle.style.animation='none';}
    if(scRow){scRow.style.webkitAnimation='none';scRow.style.animation='none';}
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      if(scTitle){scTitle.style.webkitAnimation='row-rise .8s cubic-bezier(.22,1,.36,1) .3s both';scTitle.style.animation='row-rise .8s cubic-bezier(.22,1,.36,1) .3s both';}
      if(scRow){scRow.style.webkitAnimation='fade-up .85s ease .4s forwards';scRow.style.animation='fade-up .85s ease .4s forwards';}
    });});
    frame.classList.add('showcase-mode');
  } else {
    boardTitle.textContent=sl.title||'Grill Gerichte';
    boardTitle.classList.remove('anim');
    frame.classList.remove('showcase-mode');
    requestAnimationFrame(function(){requestAnimationFrame(function(){boardTitle.classList.add('anim');});});
  }
  clearTimeout(leaveT);leaveT=setTimeout(()=>slides.forEach(s=>{if(!s.classList.contains('on'))s.classList.remove('leaving');}),1400);
  segs.forEach((s,k)=>{s.classList.remove('on','done');if(k<next)s.classList.add('done');});
  const ms=SLIDES[next].ms||13000;
  const fill=segs[next].querySelector('.fill');
  fill.style.animation='none';void fill.offsetWidth;
  fill.style.animation=`prog ${ms}ms linear forwards`;
  segs[next].classList.add('on');i=next;
}
let timer=null;
function scheduleNext(){
  clearTimeout(timer);
  const ms=SLIDES[i].ms||13000;
  timer=setTimeout(()=>{ show(i+1); scheduleNext(); }, ms);
}
requestAnimationFrame(()=>requestAnimationFrame(()=>{ show(0); scheduleNext(); }));
function jump(n){clearTimeout(timer);show(n);scheduleNext();}
addEventListener('click',()=>jump(i+1));
addEventListener('keydown',e=>{if(e.key==='ArrowRight')jump(i+1);if(e.key==='ArrowLeft')jump(i-1);if(e.key.toLowerCase()==='f'){const el=document.documentElement;if(document.fullscreenElement||document.webkitFullscreenElement){if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();}else{if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();}}});
// auto fullscreen — sofort beim Laden + bei erster Interaktion
(function(){
  function fs(){var el=document.documentElement;
    if(!document.fullscreenElement&&!document.webkitFullscreenElement){
      if(el.requestFullscreen)el.requestFullscreen().catch(function(){});
      else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    }
  }
  // sofort versuchen (funktioniert auf Samsung Tizen ohne Interaktion)
  fs();
  // Fallback: bei erster Interaktion
  ['click','touchstart','keydown','keyup'].forEach(function(e){addEventListener(e,fs,{once:true,passive:true});});
})();
(function(){
  const vid=document.getElementById('firevid');
  if(!vid)return;
  vid.muted=true;vid.defaultMuted=true;
  const tp=()=>{if(vid.isConnected)vid.play().catch(()=>{});};
  vid.addEventListener('loadeddata',tp);vid.addEventListener('canplay',tp);tp();
  ['click','keydown','touchstart','mousemove'].forEach(ev=>addEventListener(ev,tp,{once:true,passive:true}));
})();
</script>
