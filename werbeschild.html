<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow"/>
<title>Watan Kabab — Werbeschild</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="stylesheet" href="fonts/fonts.css"/>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  background:#13100B;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
@page { size: 70cm 88cm; margin: 0; }

.sign-outer { width:70cm; height:88cm; overflow:hidden; margin:0 auto; }

.sign {
  width:70cm; height:88cm;
  background:
    linear-gradient(rgba(19,16,11,0.90), rgba(19,16,11,0.90)),
    url('bg-stone.png') center/cover no-repeat;
  display:flex; flex-direction:column; align-items:center;
  position:relative; overflow:hidden;
}

/* Border-Frame wie Menükarte */
.sign::before {
  content:''; position:absolute; inset:0; z-index:0;
  background-image: url('border-frame-schild.svg');
  background-size: 100% 100%;
  background-repeat: no-repeat;
  opacity:0.25;
  pointer-events:none;
}

/* Goldener Innenrahmen */
.sign::after {
  content:''; position:absolute; inset:0.55cm; z-index:5;
  border:2px solid rgba(237,168,40,0.65);
  pointer-events:none;
}

/* ── Haupt-Inhalt ── */
.content {
  position:relative; z-index:2;
  width:100%; height:100%;
  display:flex; flex-direction:column; align-items:center;
  padding:4cm;
}

/* ── Headline ── */
.headline {
  font-family:'Lato',sans-serif; font-weight:900;
  font-size:3cm; letter-spacing:0.45cm;
  color:#F2E6D0; text-transform:uppercase;
  text-align:center; flex-shrink:0; margin-bottom:0.18cm;
  background:linear-gradient(135deg, rgba(217,58,30,0.07) 0%, rgba(237,168,40,0.07) 100%);
  padding:0.4cm 1.6cm;
  border-radius:0.2cm;
  display:inline-block;
  box-shadow:none;
}

/* Dünne Goldlinie unter Headline */
.headline-line {
  width:18cm; height:2px; flex-shrink:0; margin-bottom:0.25cm;
  background:linear-gradient(90deg, transparent 0%, #EDA828 25%, #EDA828 50%, #EDA828 75%, transparent 100%);
  opacity:0.9;
}

/* ── Gerichte-Bereich ── */
.dishes {
  flex:1; min-height:0; width:100%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:space-between;
}

.dish-row {
  display:flex; justify-content:space-between;
  align-items:flex-end; width:100%;
}
.row-center { justify-content:center; }

.dish-card {
  display:flex; flex-direction:column;
  align-items:center; gap:0.3cm;
}

/* ── Alle Bilder 17.85×17.85cm (5% größer) ── */
.img-box {
  width:17.85cm; height:17.85cm;
  display:flex; align-items:center; justify-content:center;
}
.img-box img {
  width:17.85cm; height:17.85cm; object-fit:contain;
  filter:drop-shadow(0 0.45cm 1.8cm rgba(242,230,208,0.48));
}

/* Goldener Leuchtkreis hinter der Grillplatte */
.row-center .img-box {
  background:radial-gradient(circle at center, rgba(237,168,40,0.18) 0%, rgba(237,168,40,0.06) 50%, transparent 72%);
  border-radius:50%;
}

/* ── Gerichtnamen ── */
.card-name {
  font-family:'Lato',sans-serif; font-weight:900;
  font-size:2.4cm; color:#F2E6D0;
  line-height:1.15; text-align:center;
  text-transform:uppercase; letter-spacing:0.06cm;
}
.row-center .card-name { font-size:2.7cm; color:#F2E6D0; }

/* ── Untertitel ── */
.card-sub {
  display:block;
  font-family:'Lato',sans-serif; font-weight:500;
  font-size:1.3cm; color:#F2E6D0;
  letter-spacing:0.14cm; text-transform:uppercase;
  line-height:1.35; margin-top:0.05cm;
}
.card-sub::before { content:''; }
.row-center .card-sub { font-size:1.4cm; color:#F2E6D0; }

@media print {
  html,body { background:white !important; }
  .sign-outer { width:70cm !important; height:88cm !important; margin:0 !important; }
  .sign { width:70cm !important; height:88cm !important; }
  *,*::before,*::after {
    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
  }
}
</style>
</head>
<body>
<div class="sign-outer"><div class="sign">

  <div class="content">

    <div class="headline">Neue Gerichte</div>
    <div class="headline-line"></div>

    <div class="dishes">

      <div class="dish-row">
        <div class="dish-card">
          <div class="img-box" style="width:18.74cm;height:18.74cm;">
            <img src="favicon.svg" alt="Chapli Kabab"
                 style="width:18.74cm;height:18.74cm;filter:brightness(1.3) drop-shadow(0 0.55cm 2cm rgba(242,230,208,0.48));">
          </div>
          <div class="card-name">Chapli Kabab<span class="card-sub">Würziges Rinderhack vom Grill</span></div>
        </div>
        <div class="dish-card">
          <div class="img-box">
            <img src="favicon.svg" alt="Kabuli Palau">
          </div>
          <div class="card-name">Kabuli Palau<span class="card-sub">Basmatireis mit Lamm & Rosinen</span></div>
        </div>
      </div>

      <div class="dish-row row-center">
        <div class="dish-card">
          <div class="img-box">
            <img src="favicon.svg" alt="Gemischte Grillplatte">
          </div>
          <div class="card-name">Gemischte Grillplatte<span class="card-sub">Kabab, Hähnchen & Lamm</span></div>
        </div>
      </div>

      <div class="dish-row">
        <div class="dish-card">
          <div class="img-box">
            <img src="favicon.svg" alt="Sambosa">
          </div>
          <div class="card-name">Sambosa<span class="card-sub">Knusprige Teigtaschen</span></div>
        </div>
        <div class="dish-card">
          <div class="img-box">
            <img src="favicon.svg" alt="Pommes">
          </div>
          <div class="card-name">Pommes<span class="card-sub">Knusprige Pommes Frites</span></div>
        </div>
      </div>

    </div>

    <!-- QR Code -->
    <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:0.2cm;margin-top:0.25cm;padding-top:0.2cm;width:100%;">
      <img src="qr-menu.png"
           style="width:7cm;height:7cm;border-radius:0.25cm;border:1.5px solid rgba(237,168,40,0.4);">
      <span style="font-family:'Lato',sans-serif;font-size:0.7cm;color:#EDA828;letter-spacing:0.18cm;text-transform:uppercase;font-weight:600;">Digitale Speisekarte</span>
    </div>

  </div>

</div></div>
</body>
</html>
