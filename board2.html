.slide.on{opacity:1;pointer-events:auto;

.slide.leaving{opacity:0;pointer-events:none;

@-webkit-keyframes b2-in{

      <div class="grid" style="--cols:${sec.items.length}">${cards}</div>
    </div>`;
  }).join("");
  stage.insertAdjacentHTML('beforeend',`<section class="slide">${html}</section>`);
  dotsBox.insertAdjacentHTML('beforeend','<i></i>');
});

const slides=[...stage.children], dots=[...dotsBox.children];
let i=0;

function show(n){
  const prev=i;
  i=(n+slides.length)%slides.length;
  slides.forEach((s,k)=>{
    if(k===i){
      s.classList.remove('leaving','entering');
      s.classList.add('entering');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        s.classList.remove('entering');s.classList.add('on');
      }));
    } else if(k===prev&&k!==i){
      s.classList.remove('on');s.classList.add('leaving');
      setTimeout(()=>s.classList.remove('leaving'),1200);
    } else{s.classList.remove('on','leaving','entering');}
  });
  dots.forEach((d,k)=>d.classList.toggle('on',k===i));
  boardTitle.innerHTML=SLIDES[i].title;
}

show(0);
let timer=setInterval(()=>show(i+1),18000);
function jump(n){clearInterval(timer);show(n);timer=setInterval(()=>show(i+1),18000);}
addEventListener('click',()=>jump(i+1));
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')jump(i+1);
  if(e.key==='ArrowLeft')jump(i-1);
  if(e.key.toLowerCase()==='f'){
    document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  }
});
(function(){
  const fs=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});};
  ['click','touchstart','keydown'].forEach(e=>addEventListener(e,fs,{once:true,passive:true}));
})();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw2.js').catch(()=>{});}
(function(){
  var vid=document.getElementById('firevid');
  if(!vid)return;
  vid.muted=true;vid.defaultMuted=true;vid.loop=true;
  function tp(){if(!vid.isConnected)return;vid.muted=true;if(vid.paused||vid.ended)vid.play().catch(function(){});}
  vid.addEventListener('loadeddata',tp);vid.addEventListener('canplay',tp);tp();
  ['pause','ended','stalled','suspend','waiting','emptied'].forEach(function(ev){vid.addEventListener(ev,function(){setTimeout(tp,100);});});
  setInterval(tp,2000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)tp();});
  window.addEventListener('focus',tp);window.addEventListener('pageshow',tp);
})();
(function(){
  var fs=function(){var el=document.documentElement;
    if(!document.fullscreenElement&&!document.webkitFullscreenElement){
      if(el.requestFullscreen)el.requestFullscreen().catch(function(){});
      else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    }};
  fs();
  ['click','touchstart','keydown','keyup'].forEach(function(e){addEventListener(e,fs,{once:true,passive:true});});
})();
</script>
</body>
