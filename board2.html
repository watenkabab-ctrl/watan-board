<style>
:root{
  --g:#C8922A;--gl:#E8B84A;--gc:#FFE8A0;--cream:#EFE1C5;--mute:#7A6248;
  --ease:cubic-bezier(.22,1,.36,1);--ease-up:cubic-bezier(.4,0,1,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#3d1a06;overscroll-behavior:none}
body{font-family:"Raleway",system-ui,sans-serif;color:#EFE1C5;cursor:none;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision;image-rendering:-webkit-optimize-contrast}
.ember,.ember2{will-change:opacity}

/* NO filter/mask on video or its wrapper — Tizen drops video if parent has filter */
.ytbg{position:fixed;inset:0;z-index:1;overflow:hidden;background:#000}
.ytbg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.88}
.ytbg-ov{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to top,rgba(255,120,0,.30) 0%,rgba(220,80,0,.08) 45%,transparent 72%),
    radial-gradient(ellipse 110% 55% at 50% 100%,rgba(255,150,0,.18),transparent 60%);
  mix-blend-mode:screen}
.shade{position:fixed;inset:0;z-index:2;pointer-events:none;background:none}
.texture{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml,%3Csvg width='300' height='300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='300' height='300' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E")}
.ember{position:fixed;inset:auto 0 -2% 0;height:65vh;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse 100% 100% at 50% 110%,rgba(255,160,0,1.0),rgba(230,100,0,.65) 42%,rgba(190,50,0,.22) 64%,transparent 75%);
  animation:eb 4s ease-in-out infinite}
@keyframes eb{0%,100%{opacity:.95}50%{opacity:1}}
.ember2{position:fixed;inset:auto 0 -4% 0;height:50vh;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse 70% 80% at 50% 112%,rgba(255,180,0,.70),rgba(255,90,0,.35) 40%,transparent 62%);
  animation:eb2 3s ease-in-out infinite}
@keyframes eb2{0%,100%{opacity:.85}50%{opacity:1}}
.vignette{position:fixed;inset:0;z-index:8;pointer-events:none;
  box-shadow:inset 0 0 8vw 1vw rgba(0,0,0,.15)}
.side-glow{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:
    radial-gradient(ellipse 32% 80% at 0% 50%,rgba(255,200,100,.55),transparent 70%),
    radial-gradient(ellipse 32% 80% at 100% 50%,rgba(255,200,100,.55),transparent 70%)}

/* ── FRAME ── */
.frame{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;padding:1.2vh 2.5vw 1vh}

/* ── HEADER ── */
.head{text-align:center;flex-shrink:0;padding:.1vh 0 .05vh;
  transition:opacity .5s ease,transform .5s ease}
.board-brand{font-size:1.12vw;letter-spacing:.45em;text-transform:uppercase;
  color:rgba(225,175,55,.92);font-weight:600;margin-bottom:.05vh;
  font-family:"Raleway",system-ui,sans-serif}
.board-title{position:relative;display:inline-block;
  font-family:"Lora",serif;font-weight:700;
  font-size:4.70vw;line-height:1.0;letter-spacing:.04em;
  background:linear-gradient(135deg,#E8B84A,#FFE8A0 45%,#C8922A);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 8px rgba(0,0,0,1)) drop-shadow(0 2px 6px rgba(0,0,0,1))}
.board-title::before,.board-title::after{
  content:"";position:absolute;bottom:-.5vh;left:50%;transform:translateX(-50%);
  height:1px;background:linear-gradient(90deg,transparent,rgba(232,184,74,.6),rgba(255,232,160,.9),rgba(232,184,74,.6),transparent);
  animation:line-expand 1.4s cubic-bezier(.22,1,.36,1) forwards}
.board-title::before{width:0;animation-delay:.3s}
.board-title::after{width:0;bottom:-.9vh;opacity:.4;animation-delay:.5s}
@keyframes line-expand{to{width:110%}}

/* ── STAGE ── */
.stage{flex:1;min-height:0;position:relative;margin:.25vh 0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;gap:.48vh;
  opacity:0;pointer-events:none;will-change:opacity,transform;transform:translateZ(0)}
.slide.on{opacity:1;pointer-events:auto;
  animation:b2-in .90s cubic-bezier(.22,1,.36,1) both}
.slide.leaving{opacity:0;pointer-events:none;
  animation:b2-out .52s cubic-bezier(.4,0,1,1) both}
@keyframes b2-in{
  from{opacity:0;transform:scale(1.035) translateZ(0)}
  to  {opacity:1;transform:scale(1)     translateZ(0)}}
@keyframes b2-out{
  from{opacity:1;transform:scale(1)    translateZ(0)}
  to  {opacity:0;transform:scale(.975) translateZ(0)}}
.slide.on .item{animation:card-in .60s cubic-bezier(.22,1,.36,1) calc(var(--i,0)*.055s) both}
@keyframes card-in{from{opacity:0;transform:translateY(.8vh)}to{opacity:1;transform:translateY(0)}}

/* ── SECTION GROUP ── */
.sl-group{flex:1;min-height:0;display:flex;flex-direction:column;gap:.16vh}

/* ── SECTION HEADER ── */
.sl-head{flex-shrink:0;display:flex;align-items:center;gap:.65vw;margin-bottom:.06vh}
.sl-head::before{content:"";width:1.5vw;height:1px;flex-shrink:0;
  background:linear-gradient(270deg,rgba(200,146,42,.50),transparent)}
.sl-head::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,rgba(200,146,42,.40),rgba(200,146,42,.05),transparent)}
.sl-head span{font-family:"Lora",serif;font-weight:700;font-style:italic;
  font-size:2.65vw;letter-spacing:.042em;white-space:nowrap;
  color:#E0AA40;text-shadow:0 0 2.5vw rgba(220,150,30,.45),0 1px 2px rgba(0,0,0,.7)}

/* ── GRID ── */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,4),1fr);
  grid-template-rows:1fr;gap:.42vh .52vw}

/* ── ITEM ── */
.item{display:flex;flex-direction:column;min-width:0;min-height:0;
  background:rgba(100,50,8,.55);
  border:1px solid rgba(255,220,120,.9);
  border-radius:1vw;overflow:hidden;
  box-shadow:0 4px 28px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,215,100,.07);
  position:relative;contain:layout style paint}

/* ── IMAGE AREA ── */
.item .pic{flex:1 1 0;min-height:14vh;position:relative;overflow:hidden}
.item .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  object-position:center bottom;z-index:1;
  animation:float 8s cubic-bezier(.45,.05,.55,.95) var(--fdel,0s) infinite;will-change:transform;
  transform:translateZ(0) scale(var(--imgsz,1));
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  image-rendering:-webkit-optimize-contrast;image-rendering:high-quality}
.slide:not(.on) .item .pic img{animation-play-state:paused}
@keyframes float{
  0%,100%{transform:translateY(0) translateZ(0) scale(var(--imgsz,1))}
  50%{transform:translateY(-.75vh) translateZ(0) scale(var(--imgsz,1))}
}
.item .pic .emo{position:absolute;inset:0;display:grid;place-items:center;
  font-size:min(11vh,8vw);z-index:1}
.item .pic .nr{position:absolute;top:.32vh;left:.28vw;z-index:3;
  font-family:"Lora",serif;font-weight:700;font-size:2.05vw;line-height:1;
  color:#EDD068;letter-spacing:.06em;
  background:rgba(6,1,0,.88);padding:.26vh .52vw .22vh;
  border-radius:.38vw;border:1px solid rgba(200,146,42,.55);
  text-shadow:0 0 1vw rgba(220,160,40,.55);
  box-shadow:0 1px 6px rgba(0,0,0,.65)}

/* ── INFO PANEL ── */
.item .info{flex:0 0 auto;padding:.55vh .8vw .75vh;
  background:linear-gradient(180deg,rgba(4,1,0,.0) 0%,rgba(4,1,0,.15) 18%,rgba(4,1,0,.28) 100%);
  border-top:1px solid rgba(200,146,42,.22);position:relative}
.item .info::before{content:"";position:absolute;top:0;left:.8vw;right:.8vw;height:1px;
  background:linear-gradient(90deg,transparent,rgba(232,184,74,.35),transparent)}
.item .nm{font-family:"Lora",serif;font-weight:700;font-size:1.60vw;line-height:1.18;
  color:#FFFAF0;letter-spacing:0;
  text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .desc{font-family:"Raleway",sans-serif;font-size:1.04vw;color:#EDD8A8;line-height:1.25;margin-top:.1vh;
  letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .bot{display:flex;align-items:baseline;justify-content:space-between;margin-top:.15vh;gap:.5vw}
.item .pr{font-family:"Lora",serif;font-weight:900;font-size:3.20vw;line-height:1;overflow:visible;
  background:linear-gradient(135deg,#C8922A 0%,#FFE8A0 50%,#C8922A 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-rendering:geometricPrecision}
.item .pr .cur{font-size:.48em;font-weight:600;vertical-align:.2em;margin-left:.04em;
  -webkit-text-fill-color:rgba(200,146,42,.8)}

/* ── FOOTER ── */
.ft{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:2vw;
  padding-top:.42vh;border-top:1px solid rgba(200,146,42,.14)}
.ft::before,.ft::after{content:"";flex:0 0 min(5.5vw,78px);height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,146,42,.32))}
.ft::after{background:linear-gradient(270deg,transparent,rgba(200,146,42,.32))}
.ft span{font-family:"Lora",serif;font-weight:600;font-style:italic;font-size:1.46vw;
  letter-spacing:.13em;color:rgba(225,168,55,.85);text-shadow:0 0 2vw rgba(200,130,30,.28)}
.dots{display:flex;justify-content:center;gap:.9vw;margin-top:.35vh}
.dots i{width:.75vh;height:.75vh;border-radius:50%;background:rgba(200,146,42,.18);transition:background .45s,box-shadow .45s,transform .45s}
.dots i.on{background:var(--gl);box-shadow:0 0 .9vh rgba(232,175,55,.72);transform:scale(1.4)}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .slide.on{opacity:1}.slide:not(.on){opacity:0}
}
</style>

<body>
<div class="ytbg" id="ytbg">
  <video id="firevid" autoplay muted loop playsinline webkit-playsinline x5-playsinline preload="auto" poster="images/grill_fire.jpg">
    <source src="video/fire.mp4" type="video/mp4">

  <div class="ytbg-ov"></div>
</div>
<div class="ember"></div>
<div class="ember2"></div>
<div class="side-glow"></div>
<div class="texture"></div>
<div class="frame">
  <header class="head">
    <div class="board-brand">Watan Kabab</div>
    <div class="board-title" id="boardTitle">Döner &amp; Mehr</div>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="ft">
    <span>Frisch zubereitet &nbsp;·&nbsp; auch zum Mitnehmen</span>
    <div class="dots" id="dots"></div>
  </footer>
</div>
<div class="vignette"></div>
<script>
const SLIDES=[
  {
    title:"Döner &amp; Mehr",
    ms:18000,
    sections:[
      {t:"Döner",items:[
        {n:"Döner",nr:"05",p:"7",d:"Fladenbrot · Salat · Soße · mit Käse +1 €",img:"Doener_v1.webp",e:"🥙",imgsz:0.88},
        {n:"Lahmacun",nr:"07",p:"9",d:"Dönerfleisch · frischer Salat · Soße",img:"Lahmacun_v1.webp",e:"🌯",imgsz:1.06},
        {n:"Döner Box",nr:"06",p:"8,50",d:"Pommes oder Reis · Salat · Soße",img:"Doener_Box_neu.webp",e:"🥡",imgsz:0.88},
        {n:"Dönerteller",nr:"09",p:"12",d:"Pommes oder Reis · Salat · Zwiebeln · Soße",img:"Doenerteller_Pommes.webp",e:"🍽️",imgsz:0.88},
      ]},
      {t:"Vegetarisch &amp; Vegan",items:[
        {n:"Falafel-Sandwich",nr:"11",p:"7",d:"Falafel · Salat · Soße · Fladenbrot",img:"Falafel_Sandwich.webp",e:"🥙",imgsz:0.88},
        {n:"Seitan-Sandwich",nr:"13",p:"7,50",d:"Seitan · Salat · Soße · Fladenbrot",img:"Seitan_Sandwich.webp",e:"🌱",imgsz:1.20},
        {n:"Falafel-Teller",nr:"12",p:"12",d:"Falafel · Salat · Beilagen · Soße",img:"Falafel_Teller.webp",e:"🧆",imgsz:0.75},
        {n:"Seitan-Teller",nr:"14",p:"12,50",d:"Seitan · Salat · Beilagen · Soße",img:"Seitan_Teller.webp",e:"🌿",imgsz:0.88},
      ]},
    ]
  },
  {
    title:"Vorspeisen &amp; Burger",
    ms:18000,
    sections:[
      {t:"Vorspeisen",items:[
        {n:"Samosa Gemüse",nr:"01",p:"5",d:"Gemüse · Kartoffeln · Erbsen · Stück 2,50 €",img:"Samosa_Gemuese_v1.webp",e:"🥟",imgsz:0.97},
        {n:"Bolani Kachalo",nr:"02",p:"5",d:"Kartoffeln · Zwiebeln · Koriander · Stück 2,50 €",img:"Bolani_Kachalo_Gandana_v1.webp",e:"🫓",imgsz:0.88},
        {n:"Afghan Soup",nr:"04",p:"7",d:"Hähnchen · Kichererbsen · Ei · Mais · Karotten",img:"Afghan_Soup.webp",e:"🍲",imgsz:0.85},
        {n:"Shor Nakhod",nr:"03",p:"7",d:"Kichererbsen · Kartoffeln · Chutney · Pfeffer",img:"Shor_Nakhod_v1.webp",e:"🫘",imgsz:0.88},
      ]},
      {t:"Burger &amp; Fisch",items:[
        {n:"Afghan Burger",nr:"22",p:"7",d:"Dürüm-Fladen · Kalbfleisch · Pommes · Ei · Salat",img:"Afghan_Burger.webp",e:"🌯",imgsz:0.88},
        {n:"Burger mit Pommes",nr:"23",p:"9",d:"Rindfleisch-Patty · Cheddar · Salat · Pommes",img:"Burger_mit_Pommes_v1.webp",e:"🍔",imgsz:0.88},
        {n:"Fry Fish",nr:"24",p:"12,50",d:"Frittierter Fisch · Pommes oder Brot · Salat",img:"Fry_Fish.webp",e:"🐟",imgsz:0.72},
        {n:"Grill Fish",nr:"25",p:"15",d:"Gegrillter Fisch · Pommes oder Brot · Salat",img:"Grill_Fish.webp",e:"🐟",imgsz:0.72},
      ]},
    ]
  },
];

const stage=document.getElementById('stage');
const dotsBox=document.getElementById('dots');
const boardTitle=document.getElementById('boardTitle');

SLIDES.forEach((sl)=>{
  let idx=0;
  const html=sl.sections.map(sec=>{
    const cards=sec.items.map(d=>{
      const k=idx++;
      const fdel=(-(k*.85+Math.random()*.3)).toFixed(1);
      const pic=d.img
        ?`<img src="images/${d.img}" alt="" loading="eager" decoding="async">`
        :`<span class="emo">${d.e||"🍽️"}</span>`;
      const nr=d.nr?`<span class="nr">${d.nr}</span>`:"";
      const imgsz=d.imgsz?`;--imgsz:${d.imgsz}`:"";
      return `<div class="item" style="--i:${k};--fdel:${fdel}s${imgsz}">
        <div class="pic">${pic}${nr}</div>
        <div class="info">
          <div class="nm">${d.n}</div>
          <div class="desc">${d.d}</div>
          <div class="bot"><div class="pr">${d.p}<span class="cur">€</span></div></div>
        </div>
      </div>`;
    }).join("");
    return `<div class="sl-group">
      <div class="sl-head"><span>${sec.t}</span></div>
      <div class="grid" style="--cols:${sec.items.length}">${cards}</div>
    </div>`;
  }).join("");
  stage.insertAdjacentHTML('beforeend',`<section class="slide">${html}</section>`);
  dotsBox.insertAdjacentHTML('beforeend','<i></i>');
});

const slides=[...stage.children], dots=[...dotsBox.children];
let i=0,leaveTimer;

function show(n){
  const prev=i;
  i=(n+slides.length)%slides.length;
  clearTimeout(leaveTimer);
  slides.forEach((s,k)=>{
    if(k===i){
      s.classList.remove('leaving');
      void s.offsetWidth;
      s.classList.add('on');
    } else if(k===prev&&k!==i){
      s.classList.remove('on');           // explicit before leaving — no ambiguous state
      s.classList.add('leaving');
      leaveTimer=setTimeout(()=>s.classList.remove('leaving'),880);
    } else{
      s.classList.remove('on','leaving');
    }
  });
  dots.forEach((d,k)=>d.classList.toggle('on',k===i));
  // delay title to midpoint of b2-in so new title appears as new slide comes into focus
  setTimeout(()=>{boardTitle.innerHTML=SLIDES[i].title;},420);
}

show(0);
let timer=setInterval(()=>show(i+1),18000);
function jump(n){clearInterval(timer);show(n);timer=setInterval(()=>show(i+1),18000);}
addEventListener('click',()=>jump(i+1));
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')jump(i+1);
  if(e.key==='ArrowLeft')jump(i-1);
  if(e.key.toLowerCase()==='f'){
    document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  }
});
(function(){
  const fs=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});};
  ['click','touchstart','keydown'].forEach(e=>addEventListener(e,fs,{once:true,passive:true}));
})();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw2.js').catch(()=>{});}

// ── Dauerbetrieb ──────────────────────────────────────────────────────
if(navigator.wakeLock){
  const req=()=>navigator.wakeLock.request('screen').catch(()=>{});
  req();
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')req();});
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  clearInterval(timer);timer=setInterval(()=>show(i+1),18000);
});
(function(){
  let last=i;
  setInterval(()=>{
    if(document.visibilityState!=='visible')return;
    if(last===i){clearInterval(timer);show(i+1);timer=setInterval(()=>show(i+1),18000);}
    last=i;
  },35000);
})();
(function(){
  async function chk(){try{const r=await fetch(location.href,{cache:'no-store'});const t=await r.text();const h=t.length+'-'+t.slice(800,1200);if(!chk._h){chk._h=h;return;}if(chk._h!==h)location.reload(true);}catch(e){}}
  chk();setInterval(chk,180000);
})();
(function(){
  const vid=document.getElementById('firevid');
  if(!vid)return;
  function revive(){
    if(!vid.isConnected)return;
    vid.muted=true;
    if(vid.paused||vid.ended||vid.readyState<2){
      vid.play().catch(()=>{try{vid.load();vid.play().catch(()=>{});}catch(e){}});
    }
  }
  ['pause','ended','stalled','suspend','waiting','emptied','error'].forEach(ev=>
    vid.addEventListener(ev,function(){setTimeout(revive,80);}));
  let lastTime=-1,frozenCount=0;
  setInterval(function(){
    revive();
    if(!vid.paused){
      if(vid.currentTime===lastTime){frozenCount++;
        if(frozenCount>=2){frozenCount=0;try{vid.load();vid.play().catch(()=>{});}catch(e){}}}
      else{frozenCount=0;}
    }
    lastTime=vid.currentTime;
  },1500);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)revive();});
  window.addEventListener('focus',revive);
  window.addEventListener('pageshow',revive);
})();
</script>
