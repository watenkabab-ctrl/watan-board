<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watan Kabab · Döner · Vegan · Burger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Archivo:wght@400;500;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--g:#C8922A;--gl:#A07020;--gc:#7A5010;--cream:#2a1a0a;--mute:#6b5540;--bg:#fdf8f2}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg)}
body{font-family:"Archivo",system-ui,sans-serif;color:var(--cream);cursor:none;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 70% 35% at 50% 0%,rgba(255,235,190,.75),transparent 60%),
             radial-gradient(ellipse 100% 40% at 50% 105%,rgba(255,220,160,.4),transparent 65%),
             var(--bg)}
.texture{display:none}
.ember{display:none}
.vignette{position:fixed;inset:0;z-index:6;pointer-events:none;box-shadow:inset 0 0 12vw 2vw rgba(200,140,60,.08)}
.frame{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;padding:1.9vh 3.2vw 1.6vh}

/* BOARD HEADER */
.board-head{text-align:center;flex-shrink:0;padding:.5vh 0 .3vh;border-bottom:1px solid rgba(160,104,24,.2);margin-bottom:.3vh}
.board-title-b2{font-family:"Playfair Display",serif;font-weight:700;font-style:italic;font-size:2.8vw;
  background:linear-gradient(135deg,#8a5208 0%,#C8922A 40%,#6a3e06 65%,#a06810 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.board-sub{font-size:.78vw;font-weight:500;letter-spacing:.32em;color:rgba(140,88,10,.7);text-transform:uppercase;margin-top:.18vh}
/* HEADER (legacy) */
.head{text-align:center;flex-shrink:0}
.neon-name{font-family:"Pacifico",cursive;font-size:4.5vw;line-height:1.08;color:#e02020;-webkit-text-fill-color:#e02020;
  text-shadow:0 0 1.1vw rgba(255,40,0,.9),0 0 2.8vw rgba(255,10,0,.55),0 0 5vw rgba(255,0,0,.22);
  animation:fg 2.4s ease-in-out infinite}
@keyframes fg{0%,100%{text-shadow:0 0 1.1vw rgba(255,40,0,.9),0 0 2.8vw rgba(255,10,0,.55),0 0 5vw rgba(255,0,0,.22)}
  30%{text-shadow:0 0 1.9vw rgba(255,65,0,1),0 0 4.2vw rgba(255,28,0,.7),0 0 7.5vw rgba(255,0,0,.38)}
  55%{text-shadow:0 0 .65vw rgba(195,18,0,.65),0 0 1.8vw rgba(175,8,0,.38)}
  80%{text-shadow:0 0 1.45vw rgba(255,48,0,.92),0 0 3.5vw rgba(255,18,0,.58)}}
.fl,.fl-l{display:inline-block;font-size:4.3vw;vertical-align:middle;-webkit-text-fill-color:initial;color:initial;
  filter:sepia(1) saturate(6) hue-rotate(308deg) brightness(1.6) drop-shadow(0 0 .55vw rgba(255,55,0,1)) drop-shadow(0 0 1.1vw rgba(255,95,0,.72))}
.fl{margin-left:.4rem;animation:fb 1.8s ease-in-out infinite}
.fl-l{margin-right:.4rem;animation:fb 1.8s .45s ease-in-out infinite}
@keyframes fb{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-13%) scale(1.13)}}
.head-tagline{margin-top:.5vh;text-align:center}
.head-tagline span{font-size:.82vw;font-weight:500;letter-spacing:.52em;text-indent:.52em;color:rgba(160,100,10,.82);text-transform:uppercase}

/* STAGE */
.stage{flex:1;min-height:0;position:relative;margin:.5vh 0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;gap:.55vh;
  opacity:0;transform:translateY(.6vh);pointer-events:none;transition:opacity .9s ease,transform .9s ease}
.slide.on{opacity:1;transform:none;pointer-events:auto}

/* SECTION */
.sec{flex:1;min-height:0;display:flex;flex-direction:column;gap:.38vh}
.sec+.sec{padding-top:.55vh;
  border-top:1px solid rgba(180,110,25,.25)}

/* SECTION TITLE */
.sec-hd{flex-shrink:0;display:flex;align-items:center;gap:1vw}
.sec-hd::after{content:"";flex:1;height:1px;background:rgba(160,104,24,.35)}
.sec-hd span{font-family:"Playfair Display",serif;font-weight:700;font-style:italic;font-size:1.78vw;
  color:#8a5208;letter-spacing:.05em;white-space:nowrap}

/* GRID */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:.65vh 1.6vw}

/* ITEM */
.item{display:flex;flex-direction:column;min-width:0;min-height:0;padding:.4vh .35vw .5vh;
  border-bottom:1px solid rgba(175,105,22,.22)}
.item .pic{flex:1;min-height:0;position:relative}
.item .pic::before{content:"";position:absolute;inset:0 10%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 62%,rgba(215,150,50,.14),rgba(200,130,30,.03) 50%,transparent 68%);
  filter:blur(1.4vw);z-index:0}
.item .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;
  filter:drop-shadow(0 .8vh 1.6vh rgba(140,90,20,.22)) contrast(1.04) saturate(1.08)}
.item .pic .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:9vh;z-index:1}
.item .info{flex:0 0 auto;padding:.42vh 0 0}
.item .nm{font-family:"Playfair Display",serif;font-weight:700;font-size:1.38vw;line-height:1.1;color:#2a1a0a}
.item .desc{font-size:.7vw;color:var(--mute);line-height:1.24;margin-top:.16vh;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .pr{font-family:"Playfair Display",serif;font-weight:700;font-size:1.82vw;line-height:1;
  color:#9a6010;margin-top:.38vh}
.item .pr .cur{font-size:.52em;font-weight:600;opacity:.9;margin-left:.08em;vertical-align:.14em}

/* FOOTER */
.cta{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:2vw;
  padding-top:.7vh;border-top:1px solid rgba(180,110,25,.25)}
.cta::before,.cta::after{content:"";flex:0 0 min(6vw,85px);height:1px;background:linear-gradient(90deg,transparent,rgba(160,112,32,.5))}
.cta::after{background:linear-gradient(270deg,transparent,rgba(160,112,32,.5))}
.cta span{font-family:"Playfair Display",serif;font-weight:600;font-style:italic;font-size:1.22vw;
  letter-spacing:.1em;color:rgba(150,95,20,.82)}
.dots{display:flex;justify-content:center;gap:1vw;margin-top:.55vh}
.dots i{width:.85vh;height:.85vh;border-radius:50%;background:rgba(200,146,42,.3);transition:.4s}
.dots i.on{background:#C8922A;box-shadow:0 0 .8vh rgba(200,146,42,.45);transform:scale(1.35)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.slide.on{opacity:1;transform:none}.slide:not(.on){opacity:0}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="texture"></div>
<div class="frame">
  <header class="board-head">
    <div class="board-title-b2">Watan Kabab</div>
    <div class="board-sub">Döner &nbsp;·&nbsp; Vegetarisch &amp; Vegan &nbsp;·&nbsp; Burger &amp; Fisch &nbsp;·&nbsp; Vorspeisen</div>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="cta"><span>Frisch zubereitet &nbsp;·&nbsp; auch zum Mitnehmen</span><div class="dots" id="dots"></div></footer>
</div>
<div class="vignette"></div>
<script>
const PAGES=[
  {sections:[
    {t:"Döner",items:[
      {n:"5. Döner",p:"7",d:"Fladenbrot · Salat · Soße · mit Käse +1 €",img:"Doener_v1.webp",e:"🥙"},
      {n:"Döner Box",p:"8,50",d:"Pommes oder Reis · Salat · Soße",img:"Doener_Box.webp",e:"🥡",noimg:true},
      {n:"Lahmacun",p:"9",d:"Dönerfleisch · frischer Salat · Soße",img:"Lahmacun_v1.webp",e:"🌯"},
      {n:"Dönerteller Pommes",p:"12",d:"Pommes · Salat · Zwiebeln · Soße",img:"Doenerteller_Pommes.webp",e:"🍽️"},
      {n:"10. Dönerteller Reis",p:"12",d:"Reis · Salat · Zwiebeln · Soße",img:"Doenerteller_Reis.webp",e:"🍚"},
    ]},
    {t:"Vegetarisch / Vegan",items:[
      {n:"11. Falafel-Sandwich",p:"7",d:"Falafel · Salat · Soße · Fladenbrot",img:"Falafel_Sandwich.webp",e:"🥙",noimg:true},
      {n:"Falafel-Teller",p:"12",d:"Falafel · Salat · Beilagen · Soße",img:"Falafel_Teller.webp",e:"🧆",noimg:true},
      {n:"Seitan-Sandwich",p:"7,50",d:"Seitan · Salat · Soße · Fladenbrot",img:"Seitan_Sandwich.webp",e:"🌱",noimg:true},
      {n:"Seitan-Teller",p:"11,50",d:"Seitan · Salat · Beilagen · Soße",img:"Seitan_Teller.webp",e:"🌿",noimg:true},
    ]},
  ]},
  {sections:[
    {t:"Vorspeisen",items:[
      {n:"Samosa Gemüse",p:"5",d:"Gemüse · Kartoffeln · Erbsen · Stück 2,50 €",img:"Samosa_Gemuese.webp",e:"🥟"},
      {n:"Bolani Kachalo",p:"5",d:"Kartoffeln · Zwiebeln · Koriander · Stück 2,50 €",img:"Bolani_Kachalo.webp",e:"🫓"},
      {n:"Shor Nakhod",p:"7",d:"Kichererbsen · Kartoffeln · Chutney · Pfeffer",img:"Shor_Nakhod.webp",e:"🫘"},
      {n:"Afghan Soup",p:"7",d:"Hähnchen · Kichererbsen · Ei · Mais · Karotten",img:"Afghan_Soup.webp",e:"🍲",noimg:true},
    ]},
    {t:"Burger &amp; Fisch",items:[
      {n:"22. Afghan Burger",p:"7",d:"Dürüm-Fladen · Kalbfleisch · Pommes · Ei · Salat",img:"Afghan_Burger.webp",e:"🌯",noimg:true},
      {n:"Burger mit Pommes",p:"9",d:"Rindfleisch-Patty · Cheddar · Salat · Pommes",img:"Burger_mit_Pommes.webp",e:"🍔"},
      {n:"Fry Fish",p:"12,50",d:"Frittierter Fisch · Pommes oder Brot · Salat",img:"Fry_Fish.webp",e:"🐟"},
      {n:"Grill Fish",p:"15",d:"Gegrillter Fisch · Pommes oder Brot · Salat",img:"Grill_Fish.webp",e:"🐟"},
    ]},
  ]},
];
const stage=document.getElementById('stage'),dotsBox=document.getElementById('dots');
PAGES.forEach(pg=>{
  const html=pg.sections.map(sec=>{
    const cols=sec.items.length;
    const cards=sec.items.map(d=>{
      const v="?v="+Date.now();
      const img=(d.img&&!d.noimg)?`<img src="images/${d.img}${v}" alt="">`:`<span class="emo">${d.e}</span>`;
      return `<div class="item"><div class="pic">${img}</div><div class="info"><div class="nm">${d.n}</div><div class="desc">${d.d}</div><div class="pr">${d.p}<span class="cur">€</span></div></div></div>`;
    }).join("");
    return `<div class="sec"><div class="sec-hd"><span>${sec.t}</span></div><div class="grid" style="--cols:${cols}">${cards}</div></div>`;
  }).join("");
  stage.insertAdjacentHTML('beforeend',`<section class="slide">${html}</section>`);
  dotsBox.insertAdjacentHTML('beforeend','<i></i>');
});
const slides=[...stage.children],dots=[...dotsBox.children];let i=0;
function show(n){i=(n+slides.length)%slides.length;slides.forEach((s,k)=>s.classList.toggle('on',k===i));dots.forEach((d,k)=>d.classList.toggle('on',k===i));}
show(0);let timer=setInterval(()=>show(i+1),18000);
function jump(n){clearInterval(timer);show(n);timer=setInterval(()=>show(i+1),18000);}
addEventListener('click',()=>jump(i+1));
addEventListener('keydown',e=>{if(e.key==='ArrowRight')jump(i+1);if(e.key==='ArrowLeft')jump(i-1);if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}});
// Auto-update: alle 3 Min prüfen ob neue Version deployed wurde
(function(){
  async function chk(){try{const r=await fetch(location.href,{cache:'no-store'});const t=await r.text();const h=t.length+'-'+t.slice(800,1200);if(!chk._h){chk._h=h;return;}if(chk._h!==h)location.reload(true);}catch(e){}}
  chk();setInterval(chk,180000);
})();
</script>
</body>
</html>
