<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watan Kabab · Afghansiche Spezialitäten</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🍽️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,400&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>.board-title,.item .nm,.item .pr{font-synthesis:none}</style>
<style>
:root{
  --g:#C8922A;--gl:#ECC050;--gc:#FFE8A0;--cream:#F2E5CC;--mute:#9A7A58;
  --ease:cubic-bezier(.22,1,.36,1);--ease-up:cubic-bezier(.4,0,1,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#100202}
body{font-family:"Raleway",system-ui,sans-serif;color:var(--cream);cursor:none;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision}

/* ── BACKGROUND ── */
.bg{position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 120% 48% at 50% 108%,rgba(185,60,8,.24) 0%,rgba(110,28,4,.09) 48%,transparent 68%),
    radial-gradient(ellipse 65% 22% at 50% -2%,rgba(160,48,8,.11) 0%,transparent 42%),
    radial-gradient(ellipse 160% 130% at 50% 52%,#1b0503 0%,#0e0202 58%,#040101 100%)}
.texture{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.06;
  background-image:url("data:image/svg+xml,%3Csvg width='300' height='300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='300' height='300' filter='url(%23n)'/%3E%3C/svg%3E")}
.vignette{position:fixed;inset:0;z-index:8;pointer-events:none;
  box-shadow:inset 0 0 16vw 5vw rgba(0,0,0,.38)}

/* ── FRAME ── */
.frame{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;padding:.95vh 2.0vw .6vh}

/* ── HEADER ── */
.head{text-align:center;flex-shrink:0;padding:.06vh 0 .04vh}
.board-brand{font-size:.82vw;letter-spacing:.52em;text-transform:uppercase;
  color:rgba(218,162,48,.78);font-weight:600;margin-bottom:.05vh;
  font-family:"Raleway",system-ui,sans-serif}
.board-title{position:relative;display:inline-block;
  font-family:"Lora",serif;font-weight:700;
  font-size:3.45vw;line-height:1.0;letter-spacing:.035em;
  background:linear-gradient(135deg,#D49830 0%,#FFE8A0 42%,#C8922A 68%,#ECC050 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 2.5vw rgba(200,130,30,.16))}
.board-title::before,.board-title::after{
  content:"";position:absolute;bottom:-.38vh;left:50%;transform:translateX(-50%);
  height:1px;background:linear-gradient(90deg,transparent,rgba(232,184,74,.52),rgba(255,230,155,.95),rgba(232,184,74,.52),transparent);
  animation:line-expand 1.4s cubic-bezier(.22,1,.36,1) forwards}
.board-title::before{width:0;animation-delay:.25s}
.board-title::after{width:0;bottom:-.72vh;opacity:.32;animation-delay:.45s}
@keyframes line-expand{to{width:116%}}

/* ── STAGE ── */
.stage{flex:1;min-height:0;position:relative;margin:.25vh 0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;gap:.48vh;
  opacity:0;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto;transition:opacity .75s var(--ease)}
.slide.leaving{opacity:0;pointer-events:none;transition:opacity .52s var(--ease-up)}

/* ── SECTION GROUP ── */
.sl-group{flex:1;min-height:0;display:flex;flex-direction:column;gap:.16vh}

/* ── SECTION HEADER ── */
.sl-head{flex-shrink:0;display:flex;align-items:center;gap:.65vw;margin-bottom:.06vh}
.sl-head::before{content:"";width:1.5vw;height:1px;flex-shrink:0;
  background:linear-gradient(270deg,rgba(200,146,42,.55),transparent)}
.sl-head::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,rgba(200,146,42,.50),rgba(200,146,42,.06),transparent)}
.sl-head span{font-family:"Lora",serif;font-weight:700;font-style:italic;
  font-size:1.88vw;letter-spacing:.042em;white-space:nowrap;
  background:linear-gradient(120deg,#C8922A 0%,#FFE8A0 52%,#C8922A 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* ── GRID ── */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,5),1fr);
  grid-template-rows:1fr;gap:.42vh .52vw}

/* ── ITEM ── */
.item{display:flex;flex-direction:column;min-width:0;min-height:0;
  background:linear-gradient(168deg,rgba(28,8,1,.30) 0%,rgba(10,2,0,.52) 100%);
  border:1px solid rgba(218,158,48,.30);
  border-radius:1.05vw;overflow:hidden;
  box-shadow:0 4px 28px rgba(0,0,0,.60),inset 0 1px 0 rgba(255,195,65,.08);
  position:relative;contain:layout style paint}
.item::before{content:"";position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,210,80,.14),transparent);z-index:4;pointer-events:none}
.slide.on .item{animation:enter 1.1s var(--ease) both;
  animation-delay:calc(var(--i,0)*.065s);will-change:transform,opacity}
.slide.leaving .item{animation:leave .55s var(--ease-up) both;
  animation-delay:calc(var(--i,0)*.035s);will-change:transform,opacity}
@keyframes enter{0%{opacity:0;transform:translateY(4.5vh) scale(.94)}100%{opacity:1;transform:none}}
@keyframes leave{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-2.5vh) scale(.97)}}

/* ── IMAGE AREA ── */
.item .pic{flex:1 1 0;min-height:14vh;position:relative;overflow:hidden}
.item .pic::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(ellipse 115% 52% at 50% 102%,rgba(8,2,0,.32) 0%,transparent 55%),
    radial-gradient(ellipse 100% 28% at 50% -2%,rgba(18,4,1,.22) 0%,transparent 48%)}
.item .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  object-position:center center;z-index:1;
  filter:drop-shadow(0 .5vh 1.2vh rgba(0,0,0,.65));
  animation:float 7s ease-in-out var(--fdel,0s) infinite;will-change:transform}
@keyframes float{0%,100%{transform:translateY(0) scale(var(--imgsz,1))}50%{transform:translateY(-.9vh) scale(calc(var(--imgsz,1) + .012))}}
.item .pic .emo{position:absolute;inset:0;display:grid;place-items:center;
  font-size:min(11vh,8vw);z-index:1}
.item .pic .nr{position:absolute;top:.32vh;left:.28vw;z-index:3;
  font-family:"Lora",serif;font-weight:700;font-size:1.52vw;line-height:1;
  color:#EDD068;letter-spacing:.06em;
  background:rgba(6,1,0,.92);padding:.26vh .52vw .22vh;
  border-radius:.38vw;border:1px solid rgba(200,146,42,.58);
  text-shadow:0 0 1vw rgba(220,160,40,.55);
  box-shadow:0 1px 6px rgba(0,0,0,.65)}

/* ── INFO PANEL ── */
.item .info{flex:0 0 auto;padding:.58vh .68vw .76vh;
  background:linear-gradient(180deg,rgba(5,1,0,.0) 0%,rgba(6,1,0,.80) 16%,rgba(3,0,0,.95) 100%);
  border-top:1px solid rgba(200,146,42,.18);position:relative}
.item .info::before{content:"";position:absolute;top:0;left:.68vw;right:.68vw;height:1px;
  background:linear-gradient(90deg,transparent,rgba(232,184,74,.22),transparent)}
.item .nm{font-family:"Lora",serif;font-weight:700;font-size:1.70vw;line-height:1.1;
  color:#FDFAF2;letter-spacing:.022em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 8px rgba(0,0,0,.95),0 0 18px rgba(0,0,0,.75)}
.item .desc{font-family:"Raleway",sans-serif;font-size:.82vw;color:rgba(208,172,110,.78);
  line-height:1.25;margin-top:.07vh;letter-spacing:.09em;text-transform:uppercase;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  text-shadow:0 1px 3px rgba(0,0,0,.85)}
.item .bot{display:flex;align-items:baseline;justify-content:space-between;margin-top:.26vh;gap:.4vw}
.item .pr{font-family:"Lora",serif;font-weight:900;font-size:2.42vw;line-height:1;
  background:linear-gradient(135deg,#B87E20 0%,#FFE090 44%,#C8922A 78%,#FFD060 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 .6vw rgba(200,130,28,.22));
  text-rendering:geometricPrecision}
.item .pr .cur{font-size:.48em;font-weight:600;vertical-align:.2em;margin-left:.04em;
  -webkit-text-fill-color:rgba(195,140,40,.82)}

/* ── FOOTER ── */
.ft{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:2vw;
  padding-top:.42vh;border-top:1px solid rgba(200,146,42,.14)}
.ft::before,.ft::after{content:"";flex:0 0 min(5.5vw,78px);height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,146,42,.32))}
.ft::after{background:linear-gradient(270deg,transparent,rgba(200,146,42,.32))}
.ft span{font-family:"Lora",serif;font-weight:600;font-style:italic;font-size:1.06vw;
  letter-spacing:.13em;color:rgba(192,135,36,.62)}
.dots{display:flex;justify-content:center;gap:.9vw;margin-top:.35vh}
.dots i{width:.75vh;height:.75vh;border-radius:50%;background:rgba(200,146,42,.18);transition:.45s}
.dots i.on{background:var(--gl);box-shadow:0 0 .9vh rgba(232,175,55,.72);transform:scale(1.4)}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .slide.on{opacity:1}.slide:not(.on){opacity:0}
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="texture"></div>
<div class="frame">
  <header class="head">
    <div class="board-brand">Watan Kabab</div>
    <div class="board-title" id="boardTitle">Watan Kabab Spezialitäten</div>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="ft">
    <span>Traditionelle Küche &nbsp;·&nbsp; Frisch zubereitet</span>
    <div class="dots" id="dots"></div>
  </footer>
</div>
<div class="vignette"></div>
<script>
const v="?v="+"20261004j";
const SLIDES=[
  {
    title:"Watan Kabab Spezialitäten",
    ms:18000,
    sections:[
      {t:"Hauptgerichte",items:[
        {n:"Loobia",nr:"46",p:"7",d:"Bohnen-Eintopf · Tomatensauce · Gewürze",img:"Loobia.webp",e:"🫘",imgsz:1.22},
        {n:"Qorma",nr:"48",p:"9",d:"Fleisch-Eintopf · Zwiebeln · Gewürze",img:"Qorma.webp",e:"🍲",imgsz:1.22},
        {n:"Bamya (Okra)",nr:"50",p:"10",d:"Okra · Tomatensauce · Lammfleisch",img:"Bamya_Okra.webp",e:"🍲",imgsz:1.22},
        {n:"Sabzi Palak",nr:"47",p:"9",d:"Spinat · Gewürze · frische Kräuter",img:"Sabzi_Palak.webp",e:"🌿",imgsz:1.22},
        {n:"Chicken Jalfrezi",nr:"49",p:"10",d:"Hähnchen · Paprika · Zwiebeln · Gewürze",img:"Chicken_Jalfrezi.webp",e:"🍗",imgsz:1.22},
      ]},
      {t:"Palau &amp; Mantu",flex:1.6,items:[
        {n:"Kabuli Palau",nr:"40",p:"9",d:"Basmati-Reis · Karotten · Rosinen · Lamm",img:"Kabuli_Palau.webp",e:"🍚",imgsz:1.12},
        {n:"Beryani Palau",nr:"41",p:"10",d:"Gewürzreis · Lamm · Kräuter",img:"Beryani_Palau.webp",e:"🍚",imgsz:1.12},
        {n:"Molong Palau",nr:"44",p:"30",d:"Kalbshaxe · Gewürzreis · Karotten · Rosinen · für 3 Pers.",img:"Molong_Palau.webp",e:"🍚",imgsz:1.12},
        {n:"Mahicha Palau",nr:"43",p:"14",d:"Rindsbein · Gewürzreis · Beilagen",img:"Mahicha_Palau.webp",e:"🦴",imgsz:1.12},
        {n:"Mantu",nr:"45",p:"11",d:"Gedämpfte Teigtaschen · Hackfleisch · Joghurt",img:"Mantu.webp",e:"🥟",imgsz:1.08},
      ]},
    ]
  },
  {
    title:"Spezialitäten &amp; Pizza",
    ms:18000,
    sections:[
      {t:"Spezialitäten",items:[
        {n:"Pacha",nr:"51",p:"10",d:"Traditionell · Kopffleisch · Gewürze",img:"Pacha.webp",e:"🍲",imgsz:1.20},
        {n:"Rosh",nr:"53",p:"13",d:"Lammfleisch-Eintopf · Gewürze · Brot",img:"Rosh.webp",e:"🍖",imgsz:1.22},
        {n:"Chanaki",nr:"54",p:"15",d:"Lamm · Kartoffeln · Tomaten · Gewürze",img:"Chanaki.webp",e:"🫕",imgsz:1.35},
        {n:"Chicken Karahi",nr:"55",p:"15",d:"Hähnchen · Tomaten · Ingwer · Gewürze",img:"Chicken_Karahi.webp",e:"🍗",imgsz:1.18},
        {n:"Lamm Karahi",nr:"56",p:"16",d:"Lamm · Tomaten · Ingwer · Gewürze",img:"Lamm_Karahi.webp",e:"🍖",imgsz:1.15},
      ]},
      {t:"Pizza",items:[
        {n:"Margarita",nr:"34",p:"9",d:"Tomatensoße · Gauda",img:"Pizza_Margarita.webp",e:"🍕",imgsz:1.12},
        {n:"mit Spinat",nr:"35",p:"10",d:"Tomatensoße · Gauda · Spinat",img:"Pizza_Spinat.webp",e:"🍕",imgsz:1.12},
        {n:"Salami / Sucuk",nr:"36",p:"10",d:"Tomatensoße · Gauda · Salami oder Sucuk",img:"Pizza_Salami_Sucuk.webp",e:"🍕",imgsz:1.12},
        {n:"mit Tunfisch",nr:"37",p:"10",d:"Tomatensoße · Gauda · Tunfisch · Zwiebeln",img:"Pizza_Tunfisch.webp",e:"🍕",imgsz:1.12},
        {n:"mit Gemüse",nr:"39",p:"13",d:"Paprika · Champignons · Zwiebeln · Oliven",img:"Pizza_Gemuese.webp",e:"🍕",imgsz:1.12},
      ]},
    ]
  },
];

const stage=document.getElementById('stage');
const dotsBox=document.getElementById('dots');
const boardTitle=document.getElementById('boardTitle');

SLIDES.forEach((sl)=>{
  let idx=0;
  const html=sl.sections.map(sec=>{
    const cards=sec.items.map(d=>{
      const k=idx++;
      const fdel=(-(k*.85+Math.random()*.3)).toFixed(1);
      const pic=d.img
        ?`<img src="images/${d.img}${v}" alt="">`
        :`<span class="emo">${d.e||"🍽️"}</span>`;
      const nr=d.nr?`<span class="nr">${d.nr}</span>`:"";
      const imgsz=d.imgsz?`;--imgsz:${d.imgsz}`:"";
      return `<div class="item" style="--i:${k};--fdel:${fdel}s${imgsz}">
        <div class="pic">${pic}${nr}</div>
        <div class="info">
          <div class="nm">${d.n}</div>
          <div class="desc">${d.d}</div>
          <div class="bot"><div class="pr">${d.p}<span class="cur">€</span></div></div>
        </div>
      </div>`;
    }).join("");
    return `<div class="sl-group" style="flex:${sec.flex||1}">
      <div class="sl-head"><span>${sec.t}</span></div>
      <div class="grid" style="--cols:${sec.items.length}">${cards}</div>
    </div>`;
  }).join("");
  stage.insertAdjacentHTML('beforeend',`<section class="slide">${html}</section>`);
  dotsBox.insertAdjacentHTML('beforeend','<i></i>');
});

const slides=[...stage.children], dots=[...dotsBox.children];
let i=0;

function show(n){
  const prev=i;
  i=(n+slides.length)%slides.length;
  slides.forEach((s,k)=>{
    if(k===i){s.classList.remove('leaving');s.classList.add('on');}
    else if(k===prev&&k!==i){s.classList.remove('on');s.classList.add('leaving');
      setTimeout(()=>s.classList.remove('leaving'),800);}
    else{s.classList.remove('on','leaving');}
  });
  dots.forEach((d,k)=>d.classList.toggle('on',k===i));
  boardTitle.innerHTML=SLIDES[i].title;
}

show(0);
let timer=setInterval(()=>show(i+1),18000);
function jump(n){clearInterval(timer);show(n);timer=setInterval(()=>show(i+1),18000);}
addEventListener('click',()=>jump(i+1));
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')jump(i+1);
  if(e.key==='ArrowLeft')jump(i-1);
  if(e.key.toLowerCase()==='f'){
    document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  }
});
(function(){
  const fs=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});};
  ['click','touchstart','keydown'].forEach(e=>addEventListener(e,fs,{once:true,passive:true}));
})();
</script>
</body>
</html>
