<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watan Kabab · Grill Board 3</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --g:#C8922A;--gl:#E8B84A;--gc:#FFE8A0;--cream:#EFE1C5;--mute:#7A6248;
  --ease:cubic-bezier(.22,1,.36,1);--ease-up:cubic-bezier(.4,0,1,1);--dwell:13s;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#060402}
body{font-family:"Archivo",system-ui,sans-serif;color:var(--cream);cursor:none;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}

/* ── BACKGROUND (no video) ── */
.ytbg{position:fixed;inset:0;z-index:1;
  background:radial-gradient(ellipse 120% 80% at 50% 110%,rgba(5,18,8,.95),rgba(2,10,4,1) 55%,rgba(1,5,2,1) 100%)}
.shade{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(1,8,2,.98) 0%,rgba(2,12,4,.93) 20%,rgba(3,16,6,.86) 48%,rgba(2,10,3,.72) 68%,rgba(0,5,1,.32) 86%,transparent 100%)}
.texture{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml,%3Csvg width='300' height='300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='300' height='300' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E")}
/* fire glow layers */
.ember{position:fixed;inset:auto 0 -2% 0;height:52vh;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse 90% 100% at 50% 110%,rgba(255,48,0,.38),rgba(220,70,0,.14) 42%,transparent 64%);
  animation:eb 4s ease-in-out infinite}
@keyframes eb{0%,100%{opacity:.72;transform:scaleY(.96) scaleX(.98)}33%{opacity:1;transform:scaleY(1.06) scaleX(1.02)}66%{opacity:.85;transform:scaleY(.99) scaleX(1.01)}}
.ember2{position:fixed;inset:auto 0 -4% 0;height:38vh;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse 55% 80% at 48% 112%,rgba(255,120,0,.28),rgba(255,60,0,.08) 38%,transparent 58%);
  animation:eb2 2.8s ease-in-out infinite}
@keyframes eb2{0%,100%{opacity:.6;transform:scaleX(.95)}50%{opacity:1;transform:scaleX(1.08)}}
.vignette{position:fixed;inset:0;z-index:8;pointer-events:none;
  box-shadow:inset 0 0 18vw 5vw rgba(0,0,0,.65)}
#sparks{position:fixed;inset:0;z-index:6;pointer-events:none;width:100%;height:100%}
#flash{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 60% 40% at 50% 50%,rgba(255,180,40,.18),transparent 70%)}

/* ── FRAME ── */
.frame{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;padding:3vh 4.5vw 2.2vh;transform:translateZ(0)}

/* ── HEADER ── */
.head{text-align:center;flex-shrink:0;padding:.6vh 0 .4vh}
.board-title{position:relative;display:inline-block;
  font-family:"Playfair Display",serif;font-weight:700;font-style:italic;
  font-size:3.9vw;line-height:1.1;letter-spacing:.08em;
  background:linear-gradient(135deg,#E8B84A 0%,#FFE8A0 40%,#C8922A 65%,#E8B84A 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  background-size:200% auto;
  filter:drop-shadow(0 0 10px rgba(0,0,0,.9)) drop-shadow(0 2px 5px rgba(0,0,0,.85));
  animation:title-shine 5s linear infinite}
@keyframes title-shine{0%{background-position:0% center}100%{background-position:200% center}}
.board-title::before,.board-title::after{
  content:"";position:absolute;bottom:-.5vh;left:50%;transform:translateX(-50%);
  height:1px;background:linear-gradient(90deg,transparent,rgba(232,184,74,.6),rgba(255,232,160,.9),rgba(232,184,74,.6),transparent);
  animation:line-expand 1.2s cubic-bezier(.22,1,.36,1) forwards}
.board-title::before{width:0;animation-delay:.3s}
.board-title::after{width:0;bottom:-.9vh;opacity:.4;animation-delay:.5s}
@keyframes line-expand{to{width:110%}}

/* ── STAGE ── */
.stage{flex:1;min-height:0;position:relative;margin:.6vh 0;perspective:1400px}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide.leaving{opacity:0;pointer-events:none;transition:opacity .75s var(--ease-up)}

/* ── SLIDE HEADER ── */
.sl-head{flex-shrink:0;margin-bottom:.5vh}
.sl-head span{font-family:"Playfair Display",serif;font-weight:700;font-style:italic;font-size:1.85vw;
  color:var(--g);letter-spacing:.06em;display:block;
  text-shadow:0 0 2vw rgba(200,130,30,.3)}

/* ── GRID ── */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:1vh 2vw}

/* ── ITEM ── */
.item{display:flex;flex-direction:column;min-width:0;min-height:0;padding:.5vh .4vw 1.4vh;
  border-bottom:1px solid rgba(180,110,25,.18);position:relative}
.slide.on .item{animation:var(--anim,enter) var(--edur,1.25s) var(--een,cubic-bezier(.22,1,.36,1)) both;
  animation-delay:calc(var(--i,0)*var(--estag,.09s));will-change:transform,opacity}
.slide.leaving .item{animation:var(--lanim,leave) var(--ldur,.7s) var(--leas,cubic-bezier(.4,0,1,1)) both;
  animation-delay:calc(var(--i,0)*var(--lstag,.05s));will-change:transform,opacity}

/* ── ENTER KEYFRAMES ── */
@keyframes enter{
  0%{opacity:0;transform:translate(var(--fx,0),var(--fy,80vh)) scale(var(--fs,.88)) rotate(var(--fr,0deg))}
  100%{opacity:1;transform:none}}
@keyframes enter-3dx{
  0%{opacity:0;transform:rotateX(var(--rx,85deg)) translateY(var(--fy,20vh)) scale(var(--fs,.9))}
  100%{opacity:1;transform:none}}
@keyframes enter-3dy{
  0%{opacity:0;transform:rotateY(var(--ry,90deg)) translateX(var(--fx,30vw)) scale(var(--fs,.9))}
  100%{opacity:1;transform:none}}
@keyframes enter-bounce{
  0%{opacity:0;transform:translate(var(--fx,0),var(--fy,60vh)) scale(.55)}
  62%{opacity:1;transform:translate(0,0) scale(var(--fso,1.07))}
  78%{transform:scale(.97)}
  90%{transform:scale(1.02)}
  100%{opacity:1;transform:none}}
@keyframes enter-drop{
  0%{opacity:0;transform:translateY(var(--fy,-90vh)) rotate(var(--fr,0deg)) scale(1.1)}
  72%{transform:translateY(1.5vh) rotate(0) scale(.98)}
  100%{opacity:1;transform:none}}
@keyframes enter-zoom{
  0%{opacity:0;transform:scale(var(--fs,2.6)) rotate(var(--fr,0deg))}
  100%{opacity:1;transform:none}}
@keyframes enter-swing{
  0%{opacity:0;transform:translate(var(--fx,0),var(--fy,-40vh)) rotate(var(--fr,-55deg)) scale(.8)}
  65%{opacity:1;transform:translate(0,0) rotate(calc(var(--fr,0deg)*-.08)) scale(1.02)}
  100%{opacity:1;transform:none}}

/* ── LEAVE KEYFRAMES ── */
@keyframes leave{
  0%{opacity:1;transform:none}
  100%{opacity:0;transform:translate(var(--lx,0),var(--ly,-9vh)) scale(var(--ls,.94)) rotate(var(--lr,0deg))}}
@keyframes leave-3dx{
  0%{opacity:1;transform:none}
  100%{opacity:0;transform:rotateX(var(--rx,-80deg)) translateY(var(--ly,-10vh)) scale(.9)}}
@keyframes leave-3dy{
  0%{opacity:1;transform:none}
  100%{opacity:0;transform:rotateY(var(--ry,90deg)) translateX(var(--lx,0)) scale(.9)}}
@keyframes leave-shrink{
  0%{opacity:1;transform:none}
  100%{opacity:0;transform:scale(var(--ls,.04)) rotate(var(--lr,0deg))}}
@keyframes leave-up{
  0%{opacity:1;transform:none}
  28%{opacity:1;transform:translateY(1.5vh) scale(1.03)}
  100%{opacity:0;transform:translateY(var(--ly,-88vh)) scale(.88)}}
@keyframes leave-drop{
  0%{opacity:1;transform:none}
  100%{opacity:0;transform:translateY(var(--ly,90vh)) rotate(var(--lr,0deg)) scale(.92)}}
@keyframes leave-zoom{
  0%{opacity:1;transform:none}
  100%{opacity:0;transform:scale(var(--ls,2.5)) rotate(var(--lr,0deg))}}

/* ── IMAGE ── */
.item .pic{flex:1;min-height:0;position:relative}
.item .pic::before{content:"";position:absolute;inset:0 8%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 64%,rgba(220,115,30,.32),rgba(180,72,14,.07) 48%,transparent 68%);
  filter:blur(1.8vw);z-index:0}
.item .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;
  filter:drop-shadow(0 2.5vh 3.5vh rgba(0,0,0,1));
  transition:transform .4s ease}
.item .pic .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:11vh;z-index:1}
.slide.on .item .pic img{animation:float var(--fdur,6.5s) ease-in-out var(--fdel,0s) infinite;will-change:transform}
@keyframes float{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.3vh) scale(1.022)}100%{transform:translateY(0) scale(1)}}
.item .pic .smoke{position:absolute;left:0;right:0;bottom:0;height:175%;object-fit:cover;object-position:bottom;
  mix-blend-mode:screen;opacity:.36;z-index:2;
  -webkit-mask-image:linear-gradient(to top,transparent 0,#000 16%,#000 62%,transparent 100%);
  mask-image:linear-gradient(to top,transparent 0,#000 16%,#000 62%,transparent 100%)}

/* ── TEXT ── */
.item .info{flex:0 0 auto;padding:.18vh 0 0}
.item .nm{font-family:"Playfair Display",serif;font-weight:700;font-size:1.72vw;line-height:1.12;
  color:#F5EAD5;letter-spacing:.015em;
  text-shadow:0 0 12px rgba(0,0,0,1),0 1px 4px rgba(0,0,0,1),0 2px 20px rgba(0,0,0,.95)}
.item .desc{font-size:1.02vw;color:#C8B89A;line-height:1.3;margin-top:.22vh;text-shadow:0 0 8px rgba(0,0,0,1),0 1px 3px rgba(0,0,0,1);
  display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .bot{display:flex;align-items:baseline;justify-content:space-between;margin-top:.28vh;gap:.5vw}
.item .pr{font-family:"Playfair Display",serif;font-weight:700;font-size:2.2vw;line-height:1.25;padding-bottom:.3vh;
  background:linear-gradient(135deg,#C8922A,#FFE8A0 50%,#C8922A);
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:pr-shine 4s linear infinite;
  filter:drop-shadow(0 0 7px rgba(0,0,0,1)) drop-shadow(0 1px 3px rgba(0,0,0,1))}
@keyframes pr-shine{0%{background-position:0% center}100%{background-position:200% center}}
.item .pr .cur{font-size:.5em;font-weight:600;vertical-align:.18em;margin-left:.06em;
  -webkit-text-fill-color:rgba(200,146,42,.85)}
.item .badge{font-size:.9vw;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--g);border-bottom:1px solid rgba(200,146,42,.4);padding-bottom:.08em;white-space:nowrap}

/* ── SLIDE 2 CINEMATIC SHOWCASE ── */
.showcase{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:visible}
/* full-bleed warm glow backdrop */
.showcase::before{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 90% 70% at 50% 42%,rgba(200,90,15,.14),rgba(130,45,5,.04) 55%,transparent 75%);
  animation:bg-breathe 6s ease-in-out infinite;pointer-events:none}
@keyframes bg-breathe{0%,100%{opacity:.7}50%{opacity:1}}
/* plate */
.sc-img{flex:0 0 auto;width:82%;max-height:62vh;position:relative;z-index:2;
  display:flex;align-items:center;justify-content:center}
.sc-img::before{content:"";position:absolute;inset:-8% 5%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 60%,rgba(220,110,20,.38),rgba(170,60,8,.06) 48%,transparent 66%);
  filter:blur(3.5vw);z-index:0}
.sc-img img{max-width:100%;max-height:62vh;object-fit:contain;position:relative;z-index:1;
  filter:drop-shadow(0 6vh 10vh rgba(0,0,0,1)) drop-shadow(0 0 3vw rgba(215,120,25,.28)) contrast(1.07) saturate(1.09);
  animation:sc-float 8s ease-in-out infinite}
@keyframes sc-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2.2vh) scale(1.016)}}
/* bottom options */
.sc-row{position:relative;z-index:3;display:flex;flex-direction:column;gap:0;margin-top:.8vh;width:80%;
  opacity:0;animation:fade-up .85s cubic-bezier(.22,1,.36,1) .4s forwards}
@keyframes fade-up{from{opacity:0;transform:translateY(2vh)}to{opacity:1;transform:none}}
.sc-card{display:flex;align-items:center;justify-content:space-between;
  padding:1.6vh 0;border-bottom:1px solid rgba(200,146,42,.15)}
.sc-card:first-child{border-top:1px solid rgba(200,146,42,.15)}
.sc-card-left{display:flex;align-items:baseline;gap:1vw}
.sc-card-num{font-family:"Playfair Display",serif;font-weight:700;font-size:2.2vw;color:var(--cream);text-shadow:0 0 10px rgba(0,0,0,1),0 2px 8px rgba(0,0,0,1)}
.sc-card-tag{font-size:.88vw;letter-spacing:.22em;text-transform:uppercase;color:#E8B84A;font-weight:600;text-shadow:0 0 8px rgba(0,0,0,1),0 1px 4px rgba(0,0,0,1)}
.sc-card-price{font-family:"Playfair Display",serif;font-weight:700;font-size:2.8vw;color:var(--gl);text-shadow:0 0 12px rgba(0,0,0,1),0 2px 8px rgba(0,0,0,1)}
.sc-card-price .cur{font-size:.46em;vertical-align:.22em;margin-left:.05em;opacity:.85}
.sc-dot{display:none}

/* ── PROGRESS RAIL ── */
.rail{flex-shrink:0;display:flex;justify-content:center;gap:1vw;margin-top:.7vh}
.seg{width:5.5vw;height:.4vh;min-height:3px;background:rgba(200,146,42,.15);border-radius:2px;overflow:hidden}
.seg .fill{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;
  background:linear-gradient(90deg,var(--g),var(--gl))}
.seg.done .fill{transform:scaleX(1)}
.seg.on .fill{animation:prog var(--dwell) linear forwards}
@keyframes prog{to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .slide.on{opacity:1}.slide:not(.on){opacity:0}
  .slide.on .item{opacity:1;transform:none}
  .seg.on .fill,.seg.done .fill{transform:scaleX(1)}
}
</style>
</head>
<body>
<div class="ytbg" id="ytbg"></div>
<div class="shade"></div>
<div class="texture"></div>
<div class="ember"></div>
<div class="ember2"></div>
<div class="frame">
  <header class="head">
    <div class="board-title">Grill Gerichte</div>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="rail" id="rail"></footer>
</div>
<div class="vignette"></div>
<canvas id="sparks"></canvas>
<div id="flash"></div>
<script>
const SLIDES=[
  {title:"Vom Grill",star:"✦",items:[
    {n:"Chicken Wings Kebab",p:"12",d:"Marinierte Flügel · Knoblauch-Joghurt",img:"Chicken_Wings_Kebab_v1.webp"},
    {n:"Chicken Tikka Kebab",p:"12,50",d:"Tandoor · Basmati-Reis · Beilagen",img:"Chicken_Tikka_Kebab_v1.webp"},
    {n:"Zershk Palau · Hähnchen",p:"13,50",d:"Berberitzenreis · Safran · Hähnchen",img:"Zershk_Palau_Haehnchen.webp",emo:"🍗"},
    {n:"Chapli Kebab",p:"8",d:"Gehacktes Lamm · Kräuter · Fladenbrot",img:"Chapli_Kebab_v1.webp",smoke:true},
    {n:"Kobide Kebab",p:"15",d:"Rindshackfleisch · Gewürze · Basmati-Reis",img:"Kobide_Kebab.webp",emo:"🍢",smoke:true},
    {n:"Lamm Tikka Kebab",p:"18",d:"Zartes Lammfleisch · Tandoor · Beilagen",img:"Lamm_Tikka_Kebab.webp"},
    {n:"Lamm Kotelett",p:"19,50",d:"Gegrillte Lammkoteletts · Beilagen",img:"Lamm_Kotelett_v1.webp",smoke:true},
    {n:"Mix Grill · 1 Person",p:"20",d:"Wings · Chapli · Tikka · Koteletts",img:"Mix_Grill_1_Person_v1.webp",hero:true},
  ]},
  {title:"Mix Grill",showcase:{
    n:"Mix Grill",
    sub:"Frisch vom Grill · Beilagen · Soßen · Salat",
    img:"Mix_Grill_Grillplatte_v1.webp",
    opts:[
      {label:"Personen",num:"2",p:"40"},
      {label:"Personen",num:"4",p:"80"},
    ]
  }},
];
const stage=document.getElementById('stage'),rail=document.getElementById('rail');
SLIDES.forEach(sl=>{
  let inner="";
  if(sl.showcase){
    const sc=sl.showcase;
    const pills=sc.opts.map(o=>`
      <div class="sc-card">
        <div class="sc-card-left">
          <div class="sc-card-num">${o.num}</div>
          <div class="sc-card-tag">${o.label}</div>
        </div>
        <div class="sc-card-price">${o.p}<span class="cur">€</span></div>
      </div>`).join("");
    inner=`<div class="showcase">
      <div class="sc-img"><img src="images/${sc.img}" alt=""></div>
      <div class="sc-title" style="position:relative;z-index:3;text-align:center;margin-top:-2.5vh;animation:row-rise .8s cubic-bezier(.22,1,.36,1) both;animation-delay:.3s">
        <div style="font-family:'Playfair Display',serif;font-weight:700;font-style:italic;font-size:3.8vw;letter-spacing:.06em;background:linear-gradient(135deg,#E8B84A,#FFE8A0 45%,#C8922A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 10px rgba(0,0,0,1)) drop-shadow(0 2px 6px rgba(0,0,0,1))">${sc.n}</div>
        <div style="font-size:.85vw;letter-spacing:.28em;text-transform:uppercase;color:rgba(220,170,60,.9);margin-top:.3vh;text-shadow:0 0 8px rgba(0,0,0,1),0 1px 4px rgba(0,0,0,1)">${sc.sub}</div>
      </div>
      <div class="sc-row">${pills}</div>
    </div>`;
  } else {
    inner=`<div class="grid">${sl.items.map((d,idx)=>{
      const badge=d.badge?`<div class="badge">${d.badge}</div>`:"";
      const pic=d.img?`<img src="images/${d.img}" alt="">`:
        `<span class="emo">${d.emo||"🍢"}</span>`;
      const fdur=(6.2+(idx%4)*.65).toFixed(1),fdel=(-(idx*.9+Math.random()*.4)).toFixed(1);
      const desc=d.d?`<div class="desc">${d.d}</div>`:"";
      return `<div class="item" style="--i:${idx};--fdur:${fdur}s;--fdel:${fdel}s"${d.hero?" data-hero":""}><div class="pic">${pic}</div><div class="info"><div class="nm">${d.n}</div>${desc}<div class="bot"><div class="pr">${d.p}<span class="cur">€</span></div>${badge}</div></div></div>`;
    }).join("")}</div>`;
  }
  stage.insertAdjacentHTML('beforeend',`<section class="slide">${inner}</section>`);
  rail.insertAdjacentHTML('beforeend','<div class="seg"><span class="fill"></span></div>');
});
const slides=[...stage.children],segs=[...rail.children];let i=0,leaveT=0;
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),sgn=()=>Math.random()<.5?-1:1,pick=a=>a[0|Math.random()*a.length];
const EAS=['cubic-bezier(.22,1,.36,1)','cubic-bezier(.16,1,.3,1)','cubic-bezier(.34,1.56,.64,1)','cubic-bezier(.5,0,.1,1)','cubic-bezier(.25,1.6,.5,1)','cubic-bezier(.68,-.4,.27,1.55)','cubic-bezier(.2,1.4,.4,1)'];
const LEAS=['cubic-bezier(.4,0,1,1)','cubic-bezier(.55,0,1,.45)','cubic-bezier(.7,0,.9,.5)','linear'];
const EANIMS=['enter','enter','enter','enter-3dx','enter-3dy','enter-bounce','enter-drop','enter-zoom','enter-swing','enter-bounce','enter-3dx','enter-3dy','enter-drop'];
const LANIMS=['leave','leave','leave-3dx','leave-3dy','leave-shrink','leave-up','leave-drop','leave-zoom','leave-3dx','leave-3dy'];
const uvw=n=>n.toFixed(1)+'vw',uvh=n=>n.toFixed(1)+'vh',udeg=n=>n.toFixed(1)+'deg';

function makeEntrance(){
  const mode=0|rnd(0,16),een=pick(EAS),edur=rnd(.95,1.7).toFixed(2)+'s',estag=rnd(.04,.16).toFixed(3)+'s';
  const dist=rnd(70,110),ang=rnd(0,TAU),dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist;
  const rot=rnd(8,200)*sgn(),sc=Math.random()<.5?rnd(.08,.6):rnd(1.35,2.2);
  const CORNERS=[[-100,-70],[100,-70],[-100,70],[100,70]];
  const f=idx=>{
    let x=dx,y=dy,r=rot,s=sc,rx=0,ry=0,bl=0,sk=0,skx=0,fso=1.07,anim=pick(EANIMS);
    if(mode===0){/* random all same dir */}
    else if(mode===1){const a=idx*TAU/8+ang;x=Math.cos(a)*dist;y=Math.sin(a)*dist;r=rot*(idx%2?1:-1);}
    else if(mode===2){x=(idx%2?1:-1)*dist;y=rnd(-20,20);r=rot*(idx%2?1:-1);}
    else if(mode===3){const row=(idx/4|0),col=idx%4;x=(col-1.5)*dist*.8;y=(row?1:-1)*dist;r=rot*.25;}
    else if(mode===4){x=dx*.25;y=Math.abs(dy)+idx*rnd(6,20);}
    else if(mode===5){const a=rnd(0,TAU),d=rnd(70,108);x=Math.cos(a)*d;y=Math.sin(a)*d;r=rnd(-140,140);s=rnd(.08,.62);}
    else if(mode===6){x=(idx%2?1:-1)*dist;y=(idx%2?-1:1)*dist;r=rot*(idx%2?1:-1);}
    else if(mode===7){x=(idx%4-1.5)*dist*.9;y=dist*(1+idx*.08);r=rot*(idx%3-1);}/* wave left→right */
    else if(mode===8){const c=CORNERS[idx%4];x=c[0];y=c[1];r=rot*(idx%2?1:-1);}/* from corners */
    else if(mode===9){x=0;y=-Math.abs(dist)*(1+idx*.12);r=rot*(idx%2?1:-1);s=1.05;}/* gravity drop */
    else if(mode===10){x=0;y=Math.abs(dist)*(1+idx*.1);r=0;s=rnd(.88,.96);}/* bubble rise */
    else if(mode===11){const a=idx*TAU/8;x=Math.cos(a)*dist*1.2;y=Math.sin(a)*dist*.8;r=rot;}/* implode */
    else if(mode===12){x=(idx%2?1:-1)*dist;y=idx%2?-dist:dist;r=rot*(idx%2?1:-1);}/* pairs top/bot */
    else if(mode===13){const a=idx*.7+ang;x=Math.cos(a)*dist*(1-idx*.06);y=Math.sin(a)*dist*(1-idx*.06);r=rot;}/* spiral */
    else if(mode===14){x=-(8-idx)*dist*.18;y=-dist*.6*(idx%2?1.2:.8);r=rot*.2;}/* typewriter */
    else if(mode===15){x=(Math.random()-.5)*dist*2;y=(Math.random()-.5)*dist*1.4;r=rnd(-180,180);s=rnd(.05,2.2);}/* chaos */
    if(['enter-3dx','enter-drop','enter-swing'].includes(anim)){rx=(idx%2?85:-85);}
    if(['enter-3dy','enter-flip'].includes(anim)){ry=(idx%2?90:-90);}
    if(['enter-blur'].includes(anim)){bl=rnd(10,20);s=rnd(1.2,1.6);}
    if(['enter-rise'].includes(anim)){sk=rnd(3,7)*sgn();}
    if(['enter-skew'].includes(anim)){skx=rnd(22,38)*sgn();}
    if(['enter-bounce'].includes(anim)){fso=rnd(1.05,1.12);}
    return{fx:uvw(x),fy:uvh(y),fs:s.toFixed(2),fr:udeg(r),rx:udeg(rx),ry:udeg(ry),bl:bl.toFixed(0)+'px',sk:udeg(sk),skx:udeg(skx),fso:fso.toFixed(2),anim};
  };
  return{f,een,edur,estag};
}

function makeExit(){
  const mode=0|rnd(0,10),dist=rnd(60,95),ang=rnd(0,TAU),dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist;
  const rot=rnd(0,120)*sgn(),sc=Math.random()<.5?rnd(.08,.5):rnd(1.3,1.75);
  const leas=pick(LEAS),lstag=rnd(.03,.09).toFixed(3)+'s';
  const CORNERS=[[-100,-80],[100,-80],[-100,80],[100,80]];
  const f=idx=>{
    let x=dx,y=dy,r=rot,s=sc,rx=0,ry=0,bl=0,skx=0,lanim=pick(LANIMS);
    if(mode===0){/* random scatter */}
    else if(mode===1){x=(idx%2?1:-1)*dist;y=(idx%2?-1:1)*dist;r=rot*(idx%2?1:-1);}
    else if(mode===2){x=0;y=-Math.abs(dist);s=1.06;}
    else if(mode===3){const a=rnd(0,TAU),d=rnd(55,90);x=Math.cos(a)*d;y=Math.sin(a)*d;r=rnd(-100,100);}
    else if(mode===4){x=0;y=0;s=Math.random()<.5?.08:1.7;}
    else if(mode===5){x=0;y=Math.abs(dist)*(1+idx*.1);}/* drop down */
    else if(mode===6){const c=CORNERS[idx%4];x=c[0];y=c[1];r=rot*(idx%2?1:-1);}/* to corners */
    else if(mode===7){x=(idx%4-1.5)*dist*.9;y=-dist*.8;}/* wave up */
    else if(mode===8){x=(Math.random()-.5)*dist*2;y=(Math.random()-.5)*dist*1.5;r=rnd(-180,180);s=rnd(.05,2);}/* chaos */
    else if(mode===9){const a=idx*.7+ang;x=Math.cos(a)*dist*1.3;y=Math.sin(a)*dist;r=rot;}/* spiral out */
    if(['leave-3dx'].includes(lanim)){rx=(idx%2?-82:82);}
    if(['leave-3dy'].includes(lanim)){ry=(idx%2?88:-88);}
    if(['leave-blur'].includes(lanim)){bl=rnd(12,22);s=rnd(1.15,1.5);}
    if(['leave-skew'].includes(lanim)){skx=rnd(20,35)*sgn();}
    return{lx:uvw(x),ly:uvh(y),ls:s.toFixed(2),lr:udeg(r),rx:udeg(rx),ry:udeg(ry),bl:bl.toFixed(0)+'px',skx:udeg(skx),lanim};
  };
  return{f,ldur:rnd(.48,.85).toFixed(2)+'s',leas,lstag};
}

function applyEntrance(sl){
  const sc=makeEntrance(),ds=sl.querySelectorAll('.item');
  sl.style.setProperty('--een',sc.een);sl.style.setProperty('--edur',sc.edur);sl.style.setProperty('--estag',sc.estag);
  ds.forEach((el,k)=>{
    const v=sc.f(k);
    el.style.setProperty('--fx',v.fx);el.style.setProperty('--fy',v.fy);
    el.style.setProperty('--fs',v.fs);el.style.setProperty('--fr',v.fr);
    el.style.setProperty('--rx',v.rx);el.style.setProperty('--ry',v.ry);
    el.style.setProperty('--bl',v.bl);el.style.setProperty('--sk',v.sk);
    el.style.setProperty('--skx',v.skx);el.style.setProperty('--fso',v.fso);
    el.style.setProperty('--anim',v.anim);
  });
}
function applyExit(sl){
  const sc=makeExit(),ds=sl.querySelectorAll('.item');
  sl.style.setProperty('--ldur',sc.ldur);sl.style.setProperty('--leas',sc.leas);sl.style.setProperty('--lstag',sc.lstag);
  ds.forEach((el,k)=>{
    const v=sc.f(k);
    el.style.setProperty('--lx',v.lx);el.style.setProperty('--ly',v.ly);
    el.style.setProperty('--ls',v.ls);el.style.setProperty('--lr',v.lr);
    el.style.setProperty('--rx',v.rx);el.style.setProperty('--ry',v.ry);
    el.style.setProperty('--bl',v.bl);el.style.setProperty('--skx',v.skx);
    el.style.setProperty('--lanim',v.lanim);
  });
}
function setVideos(sl,play){sl.querySelectorAll('video').forEach(v=>{try{play?v.play().catch(()=>{}):v.pause();}catch(e){}});}
function show(n){
  const next=(n+slides.length)%slides.length;
  slides.forEach((s,k)=>{
    if(k===next){s.classList.remove('leaving');applyEntrance(s);s.classList.add('on');setVideos(s,true);}
    else if(k===i&&k!==next){s.classList.remove('on');applyExit(s);s.classList.add('leaving');setVideos(s,false);}
    else{s.classList.remove('on','leaving');setVideos(s,false);}
  });
  clearTimeout(leaveT);leaveT=setTimeout(()=>slides.forEach(s=>{if(!s.classList.contains('on'))s.classList.remove('leaving');}),1400);
  segs.forEach((s,k)=>{s.classList.remove('on','done');if(k<next)s.classList.add('done');});
  const fill=segs[next].querySelector('.fill');fill.style.animation='none';void fill.offsetWidth;fill.style.animation='';
  segs[next].classList.add('on');i=next;
  if(typeof doFlash==='function')doFlash();
}
requestAnimationFrame(()=>requestAnimationFrame(()=>show(0)));
let timer=setInterval(()=>show(i+1),13000);
function jump(n){clearInterval(timer);show(n);timer=setInterval(()=>show(i+1),13000);}
addEventListener('click',()=>jump(i+1));
addEventListener('keydown',e=>{if(e.key==='ArrowRight')jump(i+1);if(e.key==='ArrowLeft')jump(i-1);if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}});
// auto fullscreen on first interaction (TV kiosk mode)
(function(){const fs=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});};['click','touchstart','keydown'].forEach(e=>addEventListener(e,fs,{once:true,passive:true}));})();
// ── GOLDEN SPARK PARTICLES ──
(function(){
  const cv=document.getElementById('sparks');
  const ctx=cv.getContext('2d');
  const COLS=['rgba(255,200,60,','rgba(255,160,30,','rgba(255,230,100,','rgba(220,120,20,','rgba(255,255,160,'];
  let W,H,parts=[];
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  resize();addEventListener('resize',resize);
  function spawn(){
    const x=W*.15+Math.random()*W*.7;
    const spd=.18+Math.random()*.38;
    parts.push({x,y:H+2,vy:-(spd),vx:(Math.random()-.5)*.18,
      r:.7+Math.random()*2.2,life:1,decay:.0028+Math.random()*.002,
      col:COLS[0|Math.random()*COLS.length],glow:Math.random()<.22});
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    if(Math.random()<.18)spawn();
    parts=parts.filter(p=>{
      p.x+=p.vx*(1+p.life*.4);p.y+=p.vy*H;p.life-=p.decay;
      p.vx+=(Math.random()-.5)*.012;
      if(p.life<=0||p.y<-10)return false;
      const a=Math.min(p.life,.7)*(.55+p.life*.45);
      if(p.glow){
        const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4.5);
        g.addColorStop(0,p.col+(a*.7)+')');g.addColorStop(1,p.col+'0)');
        ctx.beginPath();ctx.arc(p.x,p.y,p.r*4.5,0,6.28);
        ctx.fillStyle=g;ctx.fill();
      }
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);
      ctx.fillStyle=p.col+a+')';ctx.fill();
      return true;
    });
    requestAnimationFrame(frame);
  }
  frame();
})();
// ── SLIDE FLASH ON TRANSITION ──
const flashEl=document.getElementById('flash');
function doFlash(){
  flashEl.style.transition='none';flashEl.style.opacity='1';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    flashEl.style.transition='opacity 1.1s cubic-bezier(.4,0,1,1)';
    flashEl.style.opacity='0';
  }));
}
