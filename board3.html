<style>
:root{
  --g:#C8922A;--gl:#E8B84A;--gc:#FFE8A0;--cream:#EFE1C5;--mute:#7A6248;
  --ease:cubic-bezier(.22,1,.36,1);--ease-up:cubic-bezier(.4,0,1,1);--dwell:18s;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:#1a0b03}
body{font-family:"Raleway",system-ui,sans-serif;color:var(--cream);cursor:none;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision}
.ember,.ember2{will-change:opacity}

/* ── BACKGROUND ── */
.ytbg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1;overflow:hidden;background:#000}
.ytbg video{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;object-fit:cover;
  -webkit-filter:brightness(1.45) contrast(1.0) saturate(1.3) hue-rotate(-6deg);
  filter:brightness(1.45) contrast(1.0) saturate(1.3) hue-rotate(-6deg);opacity:.72;
  -webkit-mask-image:linear-gradient(to top,#000 0%,#000 65%,rgba(0,0,0,.75) 82%,transparent 96%);
  mask-image:linear-gradient(to top,#000 0%,#000 65%,rgba(0,0,0,.75) 82%,transparent 96%)}
.shade{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(20,6,1,.15) 0%,rgba(15,4,0,.08) 30%,transparent 55%)}
.texture{position:fixed;top:0;left:0;right:0;bottom:0;z-index:3;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml,%3Csvg width='300' height='300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='300' height='300' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E")}
.ember{position:fixed;top:auto;left:0;right:0;bottom:-2%;height:60vh;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse 90% 100% at 50% 110%,rgba(255,120,0,.75),rgba(220,90,0,.38) 42%,rgba(180,40,0,.12) 64%,transparent 75%);
  -webkit-animation:eb 4s ease-in-out infinite;animation:eb 4s ease-in-out infinite}
@-webkit-keyframes eb{0%,100%{opacity:.88}50%{opacity:1}}
@keyframes eb{0%,100%{opacity:.88}50%{opacity:1}}
.ember2{position:fixed;top:auto;left:0;right:0;bottom:-4%;height:45vh;z-index:4;pointer-events:none;
  background:radial-gradient(ellipse 60% 80% at 50% 112%,rgba(255,165,0,.58),rgba(255,80,0,.26) 40%,transparent 62%);
  -webkit-animation:eb2 3s ease-in-out infinite;animation:eb2 3s ease-in-out infinite}
@-webkit-keyframes eb2{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes eb2{0%,100%{opacity:.75}50%{opacity:1}}
.vignette{position:fixed;top:0;left:0;right:0;bottom:0;z-index:8;pointer-events:none;
  box-shadow:inset 0 0 14vw 3vw rgba(0,0,0,.28)}

/* ── FRAME ── */
.frame{position:fixed;top:0;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;padding:1.2vh 2.5vw 1vh}

/* ── HEADER ── */
.head{text-align:center;flex-shrink:0;padding:.1vh 0 .05vh;
  -webkit-transition:opacity .5s ease;transition:opacity .5s ease}
.board-brand{font-size:.93vw;letter-spacing:.45em;text-transform:uppercase;
  color:rgba(225,175,55,.92);font-weight:600;margin-bottom:.05vh;
  font-family:"Raleway",system-ui,sans-serif}
.board-title{position:relative;display:inline-block;
  font-family:"Lora",serif;font-weight:700;
  font-size:4.75vw;line-height:1.0;letter-spacing:.04em;
  background:linear-gradient(135deg,#E8B84A 0%,#FFE8A0 40%,#C8922A 65%,#E8B84A 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  background-size:100% auto}
.board-title::before,.board-title::after{
  content:"";position:absolute;bottom:-.5vh;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);
  width:0;height:1px;background:linear-gradient(90deg,transparent,rgba(232,184,74,.6),rgba(255,232,160,.9),rgba(232,184,74,.6),transparent)}
.board-title::after{bottom:-.9vh;opacity:.4}
.board-title.anim::before{-webkit-animation:line-expand 1.2s cubic-bezier(.22,1,.36,1) .3s forwards;animation:line-expand 1.2s cubic-bezier(.22,1,.36,1) .3s forwards}
.board-title.anim::after{-webkit-animation:line-expand 1.2s cubic-bezier(.22,1,.36,1) .5s forwards;animation:line-expand 1.2s cubic-bezier(.22,1,.36,1) .5s forwards}
@-webkit-keyframes line-expand{to{width:110%}}
@keyframes line-expand{to{width:110%}}

/* ── STAGE ── */
.stage{flex:1;min-height:0;position:relative;margin:.1vh 0}
.slide{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:.6vh;
  opacity:0;pointer-events:none;will-change:opacity}
.slide.on{opacity:1;pointer-events:auto;-webkit-transition:opacity .9s cubic-bezier(.22,1,.36,1);transition:opacity .9s cubic-bezier(.22,1,.36,1)}
.slide.leaving{opacity:0;pointer-events:none;-webkit-transition:opacity .85s cubic-bezier(.4,0,1,1);transition:opacity .85s cubic-bezier(.4,0,1,1)}

/* ── SECTION GROUP ── */
.sl-group{flex:1;min-height:0;display:flex;flex-direction:column;gap:.3vh}

/* ── SECTION HEADER ── */
.sl-head{flex-shrink:0;margin-bottom:.15vh}
.sl-head span{font-family:"Lora",serif;font-weight:700;font-size:1.5vw;
  color:var(--g);letter-spacing:.03em;display:block;
  text-shadow:0 0 2vw rgba(200,130,30,.3)}

/* ── GRID ── */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--cols,5),1fr);
  grid-auto-rows:1fr;gap:.8vh 1vw}

/* ── ITEM ── */
.item{display:flex;flex-direction:column;min-width:0;min-height:0;padding:0;
  background:rgba(20,8,0,.18);
  border:1px solid rgba(255,200,100,.15);
  border-radius:1.2vw;overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
  position:relative;--imgsz:1.42}
.slide.on .item{-webkit-animation:enter var(--edur,1.1s) var(--een,cubic-bezier(.22,1,.36,1)) both;animation:enter var(--edur,1.1s) var(--een,cubic-bezier(.22,1,.36,1)) both;
  -webkit-animation-delay:calc(var(--i,0)*var(--estag,.09s));animation-delay:calc(var(--i,0)*var(--estag,.09s))}
@-webkit-keyframes enter{0%{opacity:0;-webkit-transform:translate(var(--fx,0px),var(--fy,0px))}100%{opacity:1;-webkit-transform:translate(0,0)}}
@keyframes enter{0%{opacity:0;transform:translate(var(--fx,0px),var(--fy,0px))}100%{opacity:1;transform:translate(0,0)}}
.slide.leaving .item{-webkit-animation:leave var(--ldur,.7s) ease-in both;animation:leave var(--ldur,.7s) ease-in both;
  -webkit-animation-delay:0s;animation-delay:0s;will-change:opacity}
@-webkit-keyframes leave{0%{opacity:1;-webkit-transform:scale(1)}100%{opacity:0;-webkit-transform:scale(.97)}}
@keyframes leave{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.97)}}

/* ── IMAGE ── */
.item .pic{flex:1 1 0;min-height:12vh;position:relative;overflow:hidden}
.item .pic img{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;object-fit:contain;
  object-position:center bottom;z-index:1;
  -webkit-filter:drop-shadow(0 6px 18px rgba(0,0,0,.70));filter:drop-shadow(0 6px 18px rgba(0,0,0,.70));
  -webkit-transform:scale(var(--imgsz,1.24)) translateZ(0);transform:scale(var(--imgsz,1.24)) translateZ(0);
  image-rendering:-webkit-optimize-contrast;image-rendering:high-quality}
.item .pic .emo{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11vh;z-index:1}
.item .pic .nr{position:absolute;top:.32vh;left:.28vw;z-index:3;
  font-family:"Lora",serif;font-weight:700;font-size:2.05vw;line-height:1;
  color:#EDD068;letter-spacing:.06em;
  background:rgba(6,1,0,.88);padding:.26vh .52vw .22vh;
  border-radius:.38vw;border:1px solid rgba(200,146,42,.55);
  text-shadow:0 0 1vw rgba(220,160,40,.55);
  box-shadow:0 1px 6px rgba(0,0,0,.65)}

/* ── TEXT PANEL ── */
.item .info{flex:0 0 auto;padding:1.2vh 1.1vw 1.4vh;
  background:linear-gradient(180deg,rgba(4,1,0,.0) 0%,rgba(4,1,0,.70) 28%,rgba(4,1,0,.80) 100%);
  border-top:1px solid rgba(200,146,42,.3);
  position:relative}
.item .info::before{content:"";position:absolute;top:0;left:1.1vw;right:1.1vw;height:1px;
  background:linear-gradient(90deg,transparent,rgba(232,184,74,.5),transparent)}
.item .nm{font-family:"Lora",serif;font-weight:700;font-size:1.85vw;line-height:1.2;
  color:#FFFAF0;letter-spacing:.02em;
  text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 6px rgba(0,0,0,1)}
.item .desc{font-family:"Raleway",sans-serif;font-size:1.0vw;color:#D4AF70;line-height:1.3;margin-top:.3vh;
  letter-spacing:.07em;text-transform:uppercase;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 3px rgba(0,0,0,.9)}
.item .bot{display:flex;align-items:center;justify-content:space-between;margin-top:.5vh;gap:.5vw}
.item .pr{font-family:"Lora",serif;font-weight:900;font-size:2.35vw;line-height:1.1;overflow:visible;
  background:linear-gradient(135deg,#C8922A 0%,#FFE8A0 50%,#C8922A 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-rendering:geometricPrecision}
.item .pr .cur{font-size:.6em;font-weight:600;vertical-align:.15em;margin-left:.05em;
  -webkit-text-fill-color:rgba(200,146,42,.9)}

/* ── PROGRESS RAIL ── */
.rail{display:flex;justify-content:center;gap:1.2vw;padding:.5vh 0;flex-shrink:0}
.seg{width:6.5vw;height:.5vh;min-height:4px;background:rgba(200,146,42,.18);border-radius:4px;overflow:hidden;
  box-shadow:0 0 4px rgba(200,146,42,.08)}
.seg .fill{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;
  background:linear-gradient(90deg,var(--g),var(--gl),var(--gc))}
.seg.done .fill{transform:scaleX(1)}
@keyframes prog{to{transform:scaleX(1)}}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .slide.on{opacity:1}.slide:not(.on){opacity:0}
  .slide.on .item{opacity:1;transform:none}
  .seg.on .fill,.seg.done .fill{transform:scaleX(1)}
}
</style>
</head>
<body>
<div class="ytbg" id="ytbg">
  <video id="firevid" autoplay muted loop playsinline webkit-playsinline x5-playsinline preload="auto" poster="images/grill_fire.jpg">
    <source src="video/fire4k.mp4" type="video/mp4">
    <source src="video/fire.mp4" type="video/mp4">
  </video>
</div>
<div class="shade"></div>
<div class="texture"></div>
<div class="ember"></div>
<div class="ember2"></div>
<div class="frame">
  <header class="head">
    <div class="board-brand">Watan Kabab</div>
    <div class="board-title" id="boardTitle">Traditionelle Gerichte</div>
  </header>
  <main class="stage" id="stage"></main>
  <footer class="rail" id="rail"></footer>
</div>
<div class="vignette"></div>
<script>
const v="?v="+"20261017i";
const SLIDES=[
  {
    title:"Traditionelle Gerichte",
    ms:18000,
    sections:[
      {t:"Hauptgerichte",items:[
        {n:"Loobia",nr:"46",p:"7",d:"Bohnen-Eintopf · Tomatensauce · Gewürze",img:"Loobia_v1.png",e:"🫘",imgsz:2.67},
        {n:"Qorma",nr:"48",p:"9",d:"Fleisch-Eintopf · Zwiebeln · Gewürze",img:"Qorma.png",e:"🍲",imgsz:1.60},
        {n:"Bamya (Okra)",nr:"50",p:"10",d:"Okra · Tomatensauce · Lammfleisch",img:"Bamya_Okra.png",e:"🍲",imgsz:1.60},
        {n:"Sabzi Palak",nr:"47",p:"9",d:"Spinat · Gewürze · frische Kräuter",img:"Sabzi_Palak.png",e:"🌿",imgsz:1.60},
        {n:"Chicken Jalfrezi",nr:"49",p:"10",d:"Hähnchen · Paprika · Zwiebeln · Gewürze",img:"Chicken_Jalfrezi_v1.png",e:"🍗",imgsz:2.67},
      ]},
      {t:"Palau &amp; Mantu",items:[
        {n:"Kabuli Palau",nr:"40",p:"9",d:"Basmati-Reis · Karotten · Rosinen · Lamm",img:"Reis_Beilage_Kabuli_v1.png",e:"🍚",imgsz:2.59},
        {n:"Beryani Palau",nr:"41",p:"10",d:"Gewürzreis · Lamm · Kräuter",img:"Beryani_Palau.png",e:"🍚",imgsz:1.53},
        {n:"Molong Palau",nr:"44",p:"30",d:"Kalbshaxe · Gewürzreis · Karotten · Rosinen · für 3 Pers.",img:"Molong_Palau.png",e:"🍚",imgsz:1.49},
        {n:"Mahicha Palau",nr:"43",p:"14",d:"Rindsbein · Gewürzreis · Beilagen",img:"Mahicha_Palau_v1.png",e:"🦴",imgsz:2.59},
        {n:"Mantu",nr:"45",p:"11",d:"Gedämpfte Teigtaschen · Hackfleisch · Joghurt",img:"Mantu.png",e:"🥟",imgsz:1.53},
      ]},
    ]
  },
  {
    title:"Spezialitäten &amp; Pizza",
    ms:18000,
    sections:[
      {t:"Spezialitäten",items:[
        {n:"Pacha",nr:"51",p:"10",d:"Traditionell · Kopffleisch · Gewürze",img:"Pacha_v1.png",e:"🍲",imgsz:2.67},
        {n:"Rosh",nr:"53",p:"13",d:"Lammfleisch-Eintopf · Gewürze · Brot",img:"Rosh.png",e:"🍖",imgsz:1.49},
        {n:"Chanaki",nr:"54",p:"15",d:"Lamm · Kartoffeln · Tomaten · Gewürze",img:"Chanaki.png",e:"🫕",imgsz:1.00},
        {n:"Chicken Karahi",nr:"55",p:"15",d:"Hähnchen · Tomaten · Ingwer · Gewürze",img:"Chicken_Karahi.png",e:"🍗",imgsz:2.54},
        {n:"Lamm Karahi",nr:"56",p:"16",d:"Lamm · Tomaten · Ingwer · Gewürze",img:"Lamm_Karahi.png",e:"🍖",imgsz:2.54},
      ]},
      {t:"Pizza",items:[
        {n:"Margarita",nr:"34",p:"9",d:"Tomatensoße · Gauda",img:"Pizza_Margarita_v1.png",e:"🍕",imgsz:2.67},
        {n:"mit Spinat",nr:"35",p:"10",d:"Tomatensoße · Gauda · Spinat",img:"Pizza_mit_Spinat_v1.png",e:"🍕",imgsz:2.67},
        {n:"Salami / Sucuk",nr:"36",p:"10",d:"Tomatensoße · Gauda · Salami oder Sucuk",img:"Pizza_mit_Salami_oder_Sucuk_v1.png",e:"🍕",imgsz:2.67},
        {n:"mit Tunfisch",nr:"37",p:"10",d:"Tomatensoße · Gauda · Tunfisch · Zwiebeln",img:"Pizza_mit_Tunfisch_v1.png",e:"🍕",imgsz:2.67},
        {n:"mit Gemüse",nr:"39",p:"13",d:"Paprika · Champignons · Zwiebeln · Oliven",img:"Pizza_mit_Gemuese_v1.png",e:"🍕",imgsz:2.67},
      ]},
    ]
  },
];

const stage=document.getElementById('stage'),rail=document.getElementById('rail');
const boardTitle=document.getElementById('boardTitle');

SLIDES.forEach((sl)=>{
  let idx=0;
  const html=sl.sections.map(sec=>{
    const cards=sec.items.map(d=>{
      const k=idx++;
      const pic=d.img
        ?`<img src="images/${d.img}${v}" alt="" loading="eager" decoding="async">`
        :`<span class="emo">${d.e||"🍽️"}</span>`;
      const nr=d.nr?`<span class="nr">${d.nr}</span>`:"";
      const imgsz=d.imgsz?`;--imgsz:${d.imgsz}`:"";
      return `<div class="item" style="--i:${k}${imgsz}">
        <div class="pic">${pic}${nr}</div>
        <div class="info">
          <div class="nm">${d.n}</div>
          <div class="desc">${d.d}</div>
          <div class="bot"><div class="pr">${d.p}<span class="cur">€</span></div></div>
        </div>
      </div>`;
    }).join("");
    return `<div class="sl-group">
      <div class="sl-head"><span>${sec.t}</span></div>
      <div class="grid" style="--cols:${sec.items.length}">${cards}</div>
    </div>`;
  }).join("");
  stage.insertAdjacentHTML('beforeend',`<section class="slide">${html}</section>`);
  rail.insertAdjacentHTML('beforeend','<div class="seg"><span class="fill"></span></div>');
});

const slides=[...stage.children], segs=[...rail.children];
let i=0;

const rnd=(a,b)=>a+Math.random()*(b-a);
const EAS=['cubic-bezier(.22,1,.36,1)','cubic-bezier(.16,1,.3,1)','cubic-bezier(.34,1.56,.64,1)','cubic-bezier(.5,0,.1,1)'];

function applyEntrance(sl){
  var een=EAS[0|rnd(0,EAS.length)];
  var edur=rnd(1.0,1.4).toFixed(2)+'s';
  var estag=rnd(.06,.11).toFixed(3)+'s';
  sl.style.setProperty('--een',een);
  sl.style.setProperty('--edur',edur);
  sl.style.setProperty('--estag',estag);
  var items=sl.querySelectorAll('.item');
  if(!items.length)return;
  var mode=0|(Math.random()*4);
  var dirs=[[-3,0],[3,0],[-3,0],[3,0],[-2.5,0],[2.5,0],[-3,0],[3,0]];
  items.forEach(function(el,k){
    var fx='0px',fy='0px';
    if(mode===0){}
    else if(mode===1){fx=(-2.5-k*0.3).toFixed(1)+'vw';}
    else if(mode===2){fx=(2.5+k*0.3).toFixed(1)+'vw';}
    else{fx=dirs[k%dirs.length][0]+'vw';}
    el.style.setProperty('--fx',fx);
    el.style.setProperty('--fy',fy);
  });
}
function applyExit(sl){
  sl.style.setProperty('--ldur',rnd(.55,.75).toFixed(2)+'s');
}

function show(n){
  const next=(n+slides.length)%slides.length;
  slides.forEach((s,k)=>{
    if(k===next){s.classList.remove('leaving');applyEntrance(s);s.classList.add('on');}
    else if(k===i&&k!==next){s.classList.remove('on');applyExit(s);s.classList.add('leaving');}
    else{s.classList.remove('on','leaving');}
  });
  boardTitle.innerHTML=SLIDES[next].title;
  boardTitle.classList.remove('anim');
  requestAnimationFrame(function(){requestAnimationFrame(function(){boardTitle.classList.add('anim');});});
  segs.forEach((s,k)=>{s.classList.remove('on','done');if(k<next)s.classList.add('done');});
  const ms=SLIDES[next].ms||18000;
  const fill=segs[next].querySelector('.fill');
  fill.style.animation='none';void fill.offsetWidth;
  fill.style.animation=`prog ${ms}ms linear forwards`;
  segs[next].classList.add('on');
  i=next;
}

let timer=null;
function scheduleNext(){
  clearTimeout(timer);
  const ms=SLIDES[i].ms||18000;
  timer=setTimeout(()=>{show(i+1);scheduleNext();},ms);
}
requestAnimationFrame(()=>requestAnimationFrame(()=>{show(0);scheduleNext();}));
function jump(n){clearTimeout(timer);show(n);scheduleNext();}

addEventListener('click',()=>jump(i+1));
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')jump(i+1);
  if(e.key==='ArrowLeft')jump(i-1);
  if(e.key.toLowerCase()==='f'){
    const el=document.documentElement;
    if(document.fullscreenElement||document.webkitFullscreenElement){
      if(document.exitFullscreen)document.exitFullscreen();
      else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
    }else{
      if(el.requestFullscreen)el.requestFullscreen();
      else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    }
  }
});
(function(){
  function fs(){var el=document.documentElement;
    if(!document.fullscreenElement&&!document.webkitFullscreenElement){
      if(el.requestFullscreen)el.requestFullscreen().catch(function(){});
      else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    }}
  fs();
  ['click','touchstart','keydown','keyup'].forEach(function(e){addEventListener(e,fs,{once:true,passive:true});});
})();
(function(){
  const vid=document.getElementById('firevid');
  if(!vid)return;
  vid.muted=true;vid.defaultMuted=true;vid.loop=true;
  const tp=()=>{if(!vid.isConnected)return;vid.muted=true;if(vid.paused||vid.ended)vid.play().catch(()=>{});};
  vid.addEventListener('loadeddata',tp);vid.addEventListener('canplay',tp);tp();
  ['pause','ended','stalled','suspend','waiting','emptied'].forEach(ev=>vid.addEventListener(ev,function(){setTimeout(tp,100);}));
  setInterval(tp,2000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)tp();});
  window.addEventListener('focus',tp);window.addEventListener('pageshow',tp);
})();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
