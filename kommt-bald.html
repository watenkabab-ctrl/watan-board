<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#0C4E22"/>
<title>WATAN KABAB – Kommt bald</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100%;
  background: #0D1210;
  color: #F2E6D0;
  font-family: 'Cormorant Garamond', Georgia, serif;
  -webkit-font-smoothing: antialiased;
}

.page {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px 110px;
  text-align: center;
}

/* Logo */
.logo-wrap { margin-bottom: 24px; }
.logo-wrap img {
  width: min(220px, 50vw);
  height: auto;
  object-fit: contain;
}

/* Name */
.name {
  font-family: 'Cormorant SC', 'Cormorant Garamond', serif;
  font-size: clamp(34px, 8vw, 64px);
  font-weight: 700;
  letter-spacing: clamp(4px, 2vw, 10px);
  text-transform: uppercase;
  color: #F2E6D0;
  line-height: 1;
}

/* Tagline */
.tagline {
  font-size: clamp(14px, 3vw, 20px);
  font-weight: 400;
  font-style: italic;
  color: rgba(242,230,208,.6);
  letter-spacing: 0.3px;
  margin-top: 10px;
  max-width: 360px;
  line-height: 1.5;
}

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  width: min(260px, 70vw);
  margin: 28px auto;
}
.divider-line { flex: 1; height: 1px; background: #EDA828; }
.divider-dot  { width: 5px; height: 5px; border-radius: 50%; background: #EDA828; flex-shrink: 0; }

/* Coming soon */
.cs-text {
  font-size: clamp(36px, 8vw, 64px);
  font-weight: 400;
  font-style: italic;
  color: #F2E6D0;
  letter-spacing: 0.5px;
  line-height: 1.1;
}
.cs-sub {
  font-size: clamp(14px, 3vw, 18px);
  font-weight: 400;
  color: rgba(242,230,208,.6);
  margin-top: 10px;
  max-width: 340px;
  line-height: 1.6;
}

/* Features */
.features {
  display: flex;
  align-items: stretch;
  margin-top: 28px;
  background: #131D14;
  border-radius: 16px;
  border: 1px solid rgba(237,168,40,.18);
  overflow: hidden;
  width: min(360px, 90vw);
}
.feature {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 18px 16px;
}
.feature-icon { display:flex; align-items:center; justify-content:center; }
.feature-label {
  font-family: 'Cormorant SC', 'Cormorant Garamond', serif;
  font-size: clamp(10px, 2.2vw, 13px);
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #F2E6D0;
  line-height: 1.3;
}
.feature-sep {
  width: 1px;
  background: rgba(237,168,40,.18);
  align-self: stretch;
}

/* Location */
.location {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 24px;
  padding: 12px 24px;
  background: #131D14;
  border-radius: 40px;
  border: 1px solid rgba(237,168,40,.18);
}
.location-icon { display:flex; align-items:center; }
.location-text {
  font-size: clamp(14px, 3vw, 16px);
  font-weight: 400;
  color: #F2E6D0;
}

/* Button */
.email-btn {
  display: inline-block;
  margin-top: 14px;
  padding: 14px 36px;
  background: #D93A1E;
  color: #FDFAF4;
  border-radius: 40px;
  font-family: 'Cormorant SC', 'Cormorant Garamond', serif;
  font-size: clamp(11px, 2.5vw, 13px);
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  text-decoration: none;
  transition: background 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.email-btn:hover, .email-btn:active {
  background: #AE2C15;
  transform: translateY(-1px);
}

/* Credit footer */
.credit {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 10px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: #131D14;
  border-top: 1px solid rgba(237,168,40,.18);
  font-family: 'Cormorant Garamond', serif;
}
.credit-label {
  font-size: 12px;
  font-weight: 400;
  color: rgba(242,230,208,.6);
}
.credit-link {
  font-family: 'Cormorant SC', 'Cormorant Garamond', serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2px;
  color: #F2E6D0;
  text-decoration: none;
  border-bottom: 1px solid #EDA828;
  padding-bottom: 1px;
  transition: color 0.2s;
}
.credit-link:hover { color: #EDA828; }

/* Animations */
.page > * { animation: up 0.6s ease both; }
.logo-wrap  { animation-delay: 0.05s; }
.name       { animation-delay: 0.12s; }
.tagline    { animation-delay: 0.18s; }
.divider    { animation-delay: 0.24s; }
.cs-text    { animation-delay: 0.30s; }
.cs-sub     { animation-delay: 0.36s; }
.features   { animation-delay: 0.42s; }
.location   { animation-delay: 0.48s; }
.email-btn  { animation-delay: 0.54s; }

@keyframes up {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Tablet (≥ 600px) ── */
@media (min-width: 600px) {
  .page { padding: 60px 40px 120px; }
  .features { width: min(420px, 80vw); }
}

/* ── Desktop (≥ 1024px) ── */
@media (min-width: 1024px) {
  .page { padding: 80px 48px 130px; }
  .logo-wrap img { width: 220px; }
}

/* ═══ Neon-Wortmarke „Watan Kabab“ (Stil wie board1) ═══ */
.neon-name{font-family:'Pacifico',cursive;color:#FF5500;-webkit-text-fill-color:#FF5500;line-height:1.1;white-space:nowrap;font-size:2.6rem;overflow:visible;
  text-shadow:0 0 4px rgba(255,255,160,.95),0 0 10px rgba(255,200,0,1),0 0 20px rgba(255,100,0,.95),0 0 40px rgba(255,30,0,.85),0 0 70px rgba(200,0,0,.5);
  animation:fire-glow 2.4s ease-in-out infinite}
@keyframes fire-glow{
  0%,100%{text-shadow:0 0 4px rgba(255,255,160,.9),0 0 10px rgba(255,190,0,.95),0 0 20px rgba(255,90,0,.9),0 0 38px rgba(255,25,0,.8),0 0 65px rgba(190,0,0,.48)}
  30%{text-shadow:0 0 6px rgba(255,255,180,1),0 0 14px rgba(255,210,0,1),0 0 28px rgba(255,110,0,1),0 0 55px rgba(255,40,0,.9),0 0 90px rgba(210,0,0,.58)}
  55%{text-shadow:0 0 3px rgba(255,230,80,.8),0 0 7px rgba(255,150,0,.85),0 0 14px rgba(255,60,0,.85),0 0 26px rgba(220,20,0,.65),0 0 48px rgba(170,0,0,.4)}
  80%{text-shadow:0 0 5px rgba(255,255,140,.92),0 0 12px rgba(255,180,0,.98),0 0 24px rgba(255,85,0,.92),0 0 45px rgba(255,25,0,.82),0 0 75px rgba(200,0,0,.52)}}
.neon-flame,.neon-flame-l{display:inline-block;vertical-align:middle;font-size:.85em;-webkit-text-fill-color:initial;color:initial;
  filter:sepia(1) saturate(8) hue-rotate(310deg) brightness(2.2) drop-shadow(0 0 6px rgba(255,80,0,1)) drop-shadow(0 0 14px rgba(255,120,0,.9)) drop-shadow(0 0 22px rgba(255,50,0,.6))}
.neon-flame{margin-left:.3rem;animation:flame-bob 1.8s ease-in-out infinite}
.neon-flame-l{margin-right:.3rem;animation:flame-bob 1.8s .45s ease-in-out infinite}
@keyframes flame-bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12%) scale(1.12)}}
.nav-logo .neon-name{font-size:clamp(1.35rem,2.4vw,1.85rem)}
.menu-head .neon-name{font-size:clamp(2.2rem,7vw,3.4rem)}
.logo-wrap .neon-name{font-size:clamp(2.2rem,8vw,3.2rem)}
@media (prefers-reduced-motion: reduce){.neon-name,.neon-flame,.neon-flame-l{animation:none}}

</style>
</head>
